<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Office — гіпотези</title>
<style>
:root{--bg:#0c1422;--card:#152235;--line:#3c526d;--tx:#e8eef7;--mut:#9aaec9;--g:#64e6a7;--r:#ff949e;--y:#ffcb68}
@media (prefers-color-scheme:light){:root{--bg:#f4f6fa;--card:#fff;--line:#c9d3e0;--tx:#13213a;--mut:#51627d;--g:#0a7d4f;--r:#b3243a;--y:#8a6100}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif;padding:12px 16px 40px}
h1{font-size:19px;margin:6px 0 2px}.mut{color:var(--mut);font-size:13px}.warn{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0}
.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:0 6px 6px 0;font:inherit}.tabs button.on{border-color:var(--y)}
.h{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.h h2{font-size:16px;margin:0 0 4px}
.L{color:var(--g)}.S{color:var(--r)}ul{margin:4px 0 8px 18px;padding:0}.sc{border-top:1px dashed var(--line);margin-top:8px;padding-top:6px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:1px 7px;font-size:12px;color:var(--mut);margin-right:4px}
</style></head><body>
<h1>Ринкові гіпотези (спостереження)</h1>
<div class="warn mut">Це внутрішні гіпотези офісу, <b>не READY</b> і не дозвіл на угоду. ENTRY/SL/TP з'являються лише для реального READY. Незалежно від статусу гіпотези, торгові рішення приймає READY-контур.</div>
<div class="tabs" id="tabs"></div>
<div id="out" class="mut">Завантаження…</div>
<script>
const ST=[['ACTIVE','Активні'],['CONFIRMED','Справдились'],['REFUTED','Спростовані'],['EXPIRED','Прострочені']];
let cur='ACTIVE';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const px=x=>x==null?'—':Number(x).toPrecision(6).replace(/\.?0+$/,'');
const ts=t=>t?new Date(t*1000).toLocaleString('uk-UA',{hour12:false,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const li=a=>(a&&a.length?'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<div class="mut">—</div>');
function card(h){
  const sc=h.scenarios||{};
  const tf=Object.entries(h.tf||{}).map(([k,v])=>`<span class="tag">${esc(k)} ${esc(v.trend||'?')}${v.relation==='AGAINST'?' ⚠':''}</span>`).join('');
  const hist=(h.history||[]).slice(-6).map(e=>`<div class="mut">${ts(e.ts)} — ${esc(e.event)}${e.from?` ${esc(e.from)}→${esc(e.to)}`:''}</div>`).join('');
  const out=h.outcome?`<div class="mut">Результат: ${esc(h.outcome.state)} · MFE ${esc(h.outcome.mfe_r)}R · MAE ${esc(h.outcome.mae_r)}R</div>`:'';
  const un=((h.context||{}).unavailable||[]).join(', ');
  return `<div class="h"><h2><span class="${h.direction==='LONG'?'L':'S'}">${esc(h.direction)}</span> ${esc(h.symbol)} · ${esc(h.family)} <span class="tag">${esc(h.stage)}</span></h2>
  <div>${esc(h.what_seen)}</div><div class="mut">${esc(h.why_this_model)}</div>
  <div>${tf}</div>
  <b>За</b>${li(h.supports)}<b>Проти</b>${li(h.contradicts)}<b>Бракує</b>${li(h.missing)}<b>Перевірити далі</b>${li(h.next_checks)}
  <div class="mut">Рівень ${px(h.level)} · інвалідація ${px(h.invalidation)} · з ${ts(h.first_ts)} · оновлено ${ts(h.last_ts)}</div>
  ${['A','B','C'].filter(k=>sc[k]).map(k=>`<div class="sc"><b>${k==='A'?'А — основний':k==='B'?'Б — альтернативний':'В — скасування'}</b>: ${esc(sc[k].title)}${li(sc[k].conditions)}<div class="mut">${esc(sc[k].next_action)} · перегляд ${esc(sc[k].review)}</div></div>`).join('')}
  ${h.plan?`<div class="sc"><b>READY-план існує окремо</b>: вхід ${px(h.plan.entry)} · SL ${px(h.plan.sl)} · TP1 ${px(h.plan.tp1)} · R/R 1:${esc(h.plan.rr_tp1)}</div>`:`<div class="mut sc">${esc(h.note||'')}</div>`}
  ${hist?`<div class="sc"><b>Історія висновків</b>${hist}</div>`:''}${out}
  ${un?`<div class="mut">Недоступний контекст: ${esc(un)}</div>`:''}</div>`;
}
async function load(){
  document.getElementById('tabs').innerHTML=ST.map(([k,t])=>`<button class="${k===cur?'on':''}" onclick="cur='${k}';load()">${t}</button>`).join('');
  const out=document.getElementById('out');out.textContent='Завантаження…';
  try{
    const r=await fetch('/api/v2/hypotheses?state='+cur,{cache:'no-store'});const d=await r.json();
    out.innerHTML=d.count?d.hypotheses.map(card).join(''):`<div class="mut">Гіпотез у стані «${esc(cur)}» немає.${d.note?' '+esc(d.note):''}</div>`;
  }catch(e){out.textContent='Не вдалося завантажити гіпотези.';}
}
load();setInterval(()=>{if(cur==='ACTIVE')load();},60000);
</script></body></html>
