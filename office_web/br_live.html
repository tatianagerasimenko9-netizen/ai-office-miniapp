<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B&R LIVE</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#0b1020;color:#eaf0ff}*{box-sizing:border-box}body{margin:0;padding:18px;max-width:1180px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.tag{background:#34225d;color:#e1d4ff;padding:8px 13px;border-radius:12px;font-weight:800}.muted{color:#a3aec7;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,350px),1fr));gap:16px;margin-top:16px}.panel,.metric,.level{background:#141d32;border:1px solid #2a3654;border-radius:15px;padding:16px}.metrics,.levels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric strong,.level strong{display:block;font-size:20px;margin-top:7px}.short{color:#ff798a}.long{color:#51dfac}.state{color:#7ed8ab}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.bar{height:9px;background:#303b53;border-radius:20px;overflow:hidden;margin:18px 0}.fill{height:100%;background:#51dfac;width:0}button,select{background:#293e65;color:white;border:1px solid #526588;border-radius:10px;padding:11px;font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.event{padding:9px 0;border-bottom:1px solid #293650;font-size:13px}.notice{color:#d6b5ff;font-size:13px;margin:15px 0}.empty{padding:24px;text-align:center;color:#a3aec7}</style></head><body>
<div class="top"><div><h1>Сценарій B&R</h1></div><select id="signal" aria-label="Сигнал"></select></div>
<div class="grid" style="display:block"><section class="panel"><div class="row"><h2>Сигнал</h2><span id="status" class="state">—</span></div><h2 id="symbol">—</h2><div class="muted" id="id">—</div><p class="muted" id="manual_badge">○ Угоду не підтверджено</p><h3>Графік Futures</h3><select id="tf"><option>M5</option><option selected>M15</option><option>H1</option><option>H4</option></select><div id="chart_a" style="height:460px"></div><div id="chart_status" class="muted"></div><h3>Рівні</h3><div class="levels" id="levels"></div></section>
<section class="panel"><div class="row"><h2>Супровід позиції</h2><span id="progress" class="state">Спостереження</span></div><div class="bar"><div class="fill" id="fill"></div></div><h3>Мої ручні дії</h3><div class="actions" id="actions"></div><p id="feedback" class="notice"></p><h3>Журнал подій</h3><div id="events" class="muted">Немає подій</div></section></div>
<script src="/static/lightweight-charts-4.2.3.js"></script><script>
const $=id=>document.getElementById(id), actions=[["OPENED","Я відкрила угоду"],["TP1_30","Я зафіксувала 30%"],["SL_BE","Я перенесла SL у BE"],["TP2_40","Я зафіксувала ще 40%"],["TP3_REST","Я закрила залишок"],["CLOSED","Я закрила позицію"]];let data=[],current=null,charts=[];
const fmt=x=>x===null||x===undefined?"—":Number(x).toLocaleString("uk-UA",{maximumFractionDigits:8});
async function drawCharts(s){
 charts.forEach(c=>{try{c.remove()}catch(e){}});charts=[];
 if(!window.LightweightCharts){$("chart_status").textContent="Немає бібліотеки графіка";return}
 try{
  const qs=new URLSearchParams({symbol:s.symbol,tf:$("tf").value,limit:"180"});
  const r=await fetch("/api/v2/candles?"+qs);const j=await r.json();
  if(!j.ok||j.data_status!=="DATA_OK"||j.fixture){$("chart_status").textContent="Реальні Futures-свічки недоступні";return}
  const bars=j.candles.filter(x=>x.time).map(x=>({time:x.time,open:+x.open,high:+x.high,low:+x.low,close:+x.close}));
  for(const id of ["chart_a"]){
   const host=$(id);host.replaceChildren();
   const c=LightweightCharts.createChart(host,{width:host.clientWidth,height:Math.max(350,Math.min(620,host.clientWidth*1.1)),layout:{background:{color:"#141d32"},textColor:"#c4d0e7"}});
   const series=c.addCandlestickSeries({upColor:"#45d4a1",downColor:"#ff7186",borderVisible:false,wickUpColor:"#45d4a1",wickDownColor:"#ff7186"});series.setData(bars);
   [["ENTRY",s.entry,"#c6a1ff"],["SL",s.sl,"#ff7186"],...(s.targets||[]).slice(0,3).map((t,i)=>["TP"+(i+1),t.p,"#45d4a1"])].forEach(([title,p,color])=>{if(Number.isFinite(+p))series.createPriceLine({price:+p,color,title,lineWidth:1,axisLabelVisible:true})});
   c.timeScale().fitContent();charts.push(c)
  }
  $("chart_status").textContent="Binance Futures · "+$("tf").value;
 }catch(e){$("chart_status").textContent="Помилка графіка; підміни даних немає"}
}
function render(){const s=data.find(x=>x.sig_id===$("signal").value)||data[0];current=s;if(!s){$("symbol").textContent="Поки немає сигналів B&R";return}
$("symbol").textContent=s.symbol+" "+s.direction;$("symbol").className=s.direction==="SHORT"?"short":"long";$("id").textContent="B&R-"+s.seq+" · "+new Date(s.created_ts*1000).toLocaleString("uk-UA");$("status").textContent=s.status;
const targets=s.targets||[];$("levels").replaceChildren();[["Вхід",s.entry],["SL",s.sl],...targets.map((t,i)=>["TP"+(i+1),t.p])].forEach(([name,val])=>{const e=document.createElement("div");e.className="level";const t=document.createElement("span");t.textContent=name;const v=document.createElement("strong");v.textContent=fmt(val);e.append(t,v);$("levels").append(e)});
const done=new Set(s.manual_actions||[]);$("manual_badge").textContent=done.has("OPENED")?"✅ Угоду відкрито вручну":"○ Угоду не підтверджено";$("actions").replaceChildren();actions.forEach(([code,label])=>{const b=document.createElement("button");b.textContent=(done.has(code)?"✓ ":"")+label;b.disabled=done.has(code);b.onclick=()=>save(code);$("actions").append(b)});
$("events").replaceChildren();const ev=s.events||[];ev.forEach(e=>{const div=document.createElement("div");div.className="event";div.textContent=new Date(e.touched_ts*1000).toLocaleString("uk-UA")+" · "+e.level+" · "+fmt(e.price);$("events").append(div)});if(!ev.length)$("events").textContent="Ще немає цінових подій";$("fill").style.width=Math.min(100,ev.filter(x=>/^TP/.test(x.level)).length/3*100)+"%";$("progress").textContent=done.has("CLOSED")?"Закрито вручну":done.has("OPENED")?"Відкрита вручну":"Без підтвердження входу";drawCharts(s)}
async function save(action){if(!current)return;const headers={"Content-Type":"application/json"};const init=window.Telegram?.WebApp?.initData;if(init)headers["X-Telegram-Init-Data"]=init;const key=sessionStorage.getItem("br_write_key");if(key)headers["X-Office-Write-Key"]=key;try{let r=await fetch("/api/br/manual",{method:"POST",headers,body:JSON.stringify({sig_id:current.sig_id,action})});let j=await r.json();if(!j.ok){$("feedback").textContent="Не збережено: "+(j.error||r.status)+". Відкрий через Telegram як власниця або налаштуй доступ запису.";return}current.manual_actions=j.manual_actions;$("feedback").textContent="Збережено ручне підтвердження. Біржових ордерів не було.";render()}catch(e){$("feedback").textContent="Помилка зв'язку, дія не підтверджена."}}
async function load(){try{let r=await fetch("/api/br/signals");let j=await r.json();if(!j.ok)throw Error(j.error);data=j.signals||[];const m=j.paper_metrics||{};$("win").textContent=m.win_rate_pct===null||m.win_rate_pct===undefined?"Н/Д":m.win_rate_pct+"% (N="+m.n+")";$("wl").textContent=m.n?m.wins+" / "+m.losses:"Н/Д";$("avg").textContent=m.avg_r===null||m.avg_r===undefined?"Н/Д":m.avg_r+" R";$("exp").textContent=m.expectancy_r===null||m.expectancy_r===undefined?"Н/Д":m.expectancy_r+" R";$("signal").replaceChildren();data.forEach(s=>{const o=document.createElement("option");o.value=s.sig_id;o.textContent="B&R-"+s.seq+" · "+s.symbol+" "+s.direction;$("signal").append(o)});const requested=new URLSearchParams(location.search).get("signal");const match=data.find(x=>String(x.seq)===requested);if(match)$("signal").value=match.sig_id;render()}catch(e){$("feedback").textContent="Не вдалося отримати сигнали: "+e.message}}
$("signal").addEventListener("change",render);$("tf").addEventListener("change",()=>{if(current)drawCharts(current)});load();
</script></body></html>
