<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>AI Office</title>
<style>
:root{
  --bg:#0B1018;--card:#151D29;--raise:#1D2938;--line:#243244;--txt:#F3F6FA;--mut:#94A3B8;
  --acc:#5DA9FF;--long:#27C99A;--short:#F36B78;--watch:#F2B65D;--neu:#8392A5;--pad:16px;
  --navh:calc(60px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box}:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{min-height:36px}html,body{margin:0;background:var(--bg);color:var(--txt);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top) 0 var(--navh) 0;min-height:100vh;overflow-x:hidden}
header{padding:12px var(--pad) 0;display:flex;justify-content:space-between;align-items:center;gap:8px;max-width:600px;margin:0 auto}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em}
main{padding:10px var(--pad) 18px;max-width:600px;margin:0 auto}
h2{font-size:14px;font-weight:600;color:var(--mut);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.05em}
.mut{color:var(--mut);font-size:12px;line-height:1.45}
.num{font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 10px;min-width:0;overflow-wrap:anywhere}
.card.tap{cursor:pointer}.card.tap:active{background:var(--raise)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.kpi b{display:block;font-size:15px;margin-top:3px;overflow-wrap:anywhere;line-height:1.25}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.sym{font-size:17px;font-weight:700;overflow-wrap:anywhere;min-width:0;max-width:100%}
.side{font-weight:700;font-size:13px;letter-spacing:.03em}
.L{color:var(--long)}.S{color:var(--short)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--mut);white-space:nowrap}
.pill.watch{border-color:var(--watch);color:var(--watch)}
.pill.live{border-color:var(--acc);color:var(--acc)}
.pill.done{border-color:var(--neu);color:var(--neu)}
.pill.unknown{border-color:var(--short);color:var(--short)}
.pill.ok{border-color:var(--long);color:var(--long)}.pill.bad{border-color:var(--short);color:var(--short)}
.lv{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(2,minmax(0,1fr)) minmax(0,.8fr);gap:6px;margin-top:10px}
.lv div{background:var(--raise);border-radius:10px;padding:7px 8px;min-width:0}
.lv span{display:block;font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.lv b{display:block;font-size:13px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
@media (max-width:420px){.lv{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lv div:first-child b{white-space:normal;overflow-wrap:anywhere}
.lv .sl b{color:var(--short)}.lv .tp b{color:var(--long)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 10px}
.sec h3{margin:0 0 6px;font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.sec p{margin:0;font-size:14px;line-height:1.5}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}.kv span{color:var(--mut)}.kv b{font-variant-numeric:tabular-nums;text-align:right;overflow-wrap:anywhere;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;margin:4px 0 10px;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:7px 12px;font-size:12px}
.chips button.on{background:var(--raise);color:var(--txt);border-color:var(--acc)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0F1621;border-top:1px solid var(--line);
  padding:6px 4px env(safe-area-inset-bottom);z-index:20}
nav button{min-height:48px;flex:1;border:0;background:transparent;padding:6px 2px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:17px;line-height:1}
nav button.on{color:var(--txt);font-weight:600}nav button.on i{filter:none}
.chart{height:320px;width:100%;border-radius:14px;background:#0E141D;border:1px solid var(--line);overflow:hidden}
.chart.full{position:fixed;inset:env(safe-area-inset-top) 0 var(--navh) 0;height:auto;z-index:15;border-radius:0}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-weight:500;font-size:11px}
.empty{padding:26px 10px;text-align:center;color:var(--mut);font-size:13px}
.banner{font-size:12px;color:var(--mut);margin:2px 0 10px}
.back{border:0;background:transparent;color:var(--acc);font-size:14px;padding:4px 0;margin-bottom:6px}
.tl{border-left:2px solid var(--line);margin-left:4px;padding-left:12px}
.tl div{position:relative;padding:4px 0;font-size:13px}
.tl div:before{content:"";position:absolute;left:-17px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--neu)}
.dot.ok{background:var(--long)}.dot.bad{background:var(--short)}.dot.warn{background:var(--watch)}
.sk{height:14px;background:linear-gradient(90deg,#151D29,#1D2938,#151D29);background-size:200% 100%;animation:s 1.2s infinite;border-radius:6px;margin:10px 0}
@keyframes s{to{background-position:-200% 0}}
.err{border-color:var(--short)}
.st{margin:8px 0;padding:10px 12px;border-radius:12px;font-weight:700;font-size:15px}
.st.w{background:rgba(224,169,74,.16);color:var(--watch)}.st.g{background:rgba(76,195,138,.16);color:var(--long)}.st.r{background:rgba(240,120,110,.16);color:var(--short)}.st.n{background:var(--raise);color:var(--mut)}
details.dbg>summary{cursor:pointer;color:var(--mut);font-size:13px;padding:8px 0}
.frm label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
.frm input,.frm select,.frm textarea{width:100%;box-sizing:border-box;background:var(--raise);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;min-height:44px}
.frm .row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.btn{border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:12px;padding:10px 14px;font-size:14px;min-height:44px}
.btn.pri{background:var(--acc);color:#0B1119;font-weight:600}
.btn.warn{border-color:var(--short);color:var(--short)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.msg{margin:8px 0;font-size:13px}.msg.bad{color:var(--short)}.msg.ok{color:var(--long)}
</style>
</head>
<body>
<header>
  <div style="min-width:0">
    <h1>AI Office</h1>
    <div class="mut" id="sub">Ручний облік · не ордер</div>
  </div>
  <span class="pill" id="stale" role="status"><span class="dot"></span> дані</span>
</header>
<main id="app" aria-live="polite"><div class="sk"></div><div class="sk"></div></main>
<nav aria-label="Основна навігація">
  <button data-r="office" class="on"><i>◎</i>Офіс</button>
  <button data-r="radar"><i>⌖</i>Радар</button>
  <button data-r="scenarios"><i>◧</i>Сценарії</button>
  <button data-r="journal"><i>≡</i>Журнал</button>
  <button data-r="risk"><i>⛨</i>Ризик</button>
</nav>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js" integrity="sha384-stKllnUqA9AD0gsKCuUtf5XlqAW7PwIgDagoNsTWkjkBmJ/GZ/uHTgEBxdLV2VSK" crossorigin="anonymous"></script>
<script>
const $=id=>document.getElementById(id);
const app=$('app');
const NA='Не визначено';
const una=v=>(v===null||v===undefined||v==='')?'—':v;
function lsGet(k,d){try{return localStorage.getItem(k)??d;}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
const S={tf:lsGet('ao_tf','H1'), sf:'all', rf:'all', jkind:'trades',prefill:null, lastBar:0,
  layers:{zone:true,sl:true,tp:true, ch:lsGet('ao_ch2','1')==='1', ctx:lsGet('ao_ctx','1')==='1'}};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function sid(v){return String(v||'').replace(/[^A-Za-z0-9._:|+-]/g,'');}
let RT=0; /* номер поточного екрана: запізніла відповідь старого екрана не має перезаписувати новий */
async function j(url){
  const t=RT;
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const d=await r.json();
  if(t!==RT){const e=new Error('stale'); e.stale=true; throw e;}
  return d;
}
function side(d){const s=String(d||'').toUpperCase(); return s==='SHORT'?'S':'L';}
function sideTxt(d){const s=String(d||'').toUpperCase(); return s==='SHORT'?'▼ SHORT':(s==='LONG'?'▲ LONG':esc(s||'—'));}
function ago(ts){
  if(!ts) return '—'; const t=Date.parse(ts); if(!isFinite(t)) return esc(ts);
  const m=Math.round((Date.now()-t)/60000);
  if(m<1) return 'щойно'; if(m<60) return m+' хв тому'; if(m<1440) return Math.round(m/60)+' год тому';
  return new Date(t).toLocaleDateString('uk-UA',{day:'2-digit',month:'2-digit'});
}
function hhmm(ts){const t=Date.parse(ts); if(!isFinite(t)) return esc(ts||''); return new Date(t).toLocaleString('uk-UA',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});}
function pill(st){st=st||{}; return `<span class="pill ${esc(st.group||'')}">${esc(st.icon||'•')} ${esc(st.short||st.code||'—')}</span>`;}
function fail(e, what){
  if(e&&e.stale) return;
  app.innerHTML=`<div class="card err"><b>Не вдалося завантажити ${esc(what)}</b>
    <div class="mut">${esc(e&&e.message||e)} · дані не показано, щоб не вводити в оману</div>
    <button class="back" id="retry">Спробувати ще раз</button></div>`;
  $('retry').onclick=()=>routes[cur]();
  setHealth('bad','немає зв’язку');
}
function setHealth(kind,text){$('stale').innerHTML=`<span class="dot ${kind}"></span> ${esc(text)}`;}
function levels(s){
  const d=s.display||{};
  return `<div class="lv">
    <div><span>Вхід</span><b>${esc(d.zone||d.entry||NA)}</b></div>
    <div class="sl"><span>Стоп</span><b>${esc(d.sl||NA)}</b></div>
    <div class="tp"><span>TP1</span><b>${esc(d.tp1||NA)}</b></div>
    <div><span>RR</span><b>${esc(d.rr||NA)}</b></div></div>`;
}
function scCard(s){
  const h=s.human||{}, d=s.display||{};
  return `<div class="card tap" role="button" tabindex="0" aria-label="Відкрити сценарій ${esc(s.symbol||'')} ${esc(s.direction||'')}" data-id="${esc(sid(s.scenario_id))}">
    <div class="top"><span class="sym">${esc(String(s.symbol||'').replace(/USDT$/,''))}</span>
      <span class="side ${side(s.direction)}">${String(s.direction||'').toUpperCase()==='SHORT'?'Продаж':'Купівля'}</span></div>
    <div class="st ${esc(h.tone||'n')}">${esc(h.icon||'')} ${esc(h.text||'')}</div>
    <div class="mut">оновлено ${ago(s.as_of)}${d.zone?` · зона ${esc(d.zone)}`:''}</div></div>`;
}
function bindCards(){app.querySelectorAll('[data-id]').forEach(el=>{
  el.onclick=()=>openSc(el.dataset.id);
  el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault(); openSc(el.dataset.id);}};
  if(!el.hasAttribute('role')){el.setAttribute('role','button'); el.setAttribute('tabindex','0');}
});}
function chips(items, curv, attr){
  return `<div class="chips" role="group">${items.map(([k,t])=>`<button data-${attr}="${k}" class="${k===curv?'on':''}" aria-pressed="${k===curv}">${t}</button>`).join('')}</div>`;
}

/* ---------- Офіс ---------- */
async function office(){
  const T0=++RT;
  app.innerHTML='<div class="sk"></div><div class="sk"></div>';
  let d,ov,sc;
  let ses=null;
  try{[d,ov,sc]=await Promise.all([j('/api/v2/home'), j('/api/v2/overview'), j('/api/v2/scenarios?watching=1')]);}
  catch(e){return fail(e,'огляд офісу');}
  try{ses=await j('/api/v2/session');}catch(e){if(e.stale) return; ses=null;}
  if(T0!==RT) return;
  $('sub').textContent=`${una(d.db_backend)} · git ${String(d.git_sha||'—').slice(0,7)} · облік вручну · ордерів немає`;
  const b=d.btc||{}, se=d.sessions||{};
  const all=sc.scenarios||[];
  const live=all.filter(s=>(s.status||{}).group==='live');
  const watch=all.filter(s=>(s.status||{}).group==='watch');
  const odd=all.filter(s=>(s.status||{}).group==='unknown');
  const marks=(ov.marks||[]);
  const okFeeds=marks.filter(m=>m.data_status==='DATA_OK').length;
  setHealth(okFeeds===marks.length&&marks.length?'ok':(okFeeds?'warn':'bad'), okFeeds===marks.length&&marks.length?'дані актуальні':(okFeeds?'дані частково':'дані недоступні'));
  const ch=b.change_24h; const chTxt=(ch==null)?'—':((ch>0?'+':'')+Number(ch).toFixed(2)+'%');
  app.innerHTML=`
    <div class="card">
      <div class="mut">Що зараз важливо</div>
      <p style="margin:6px 0 0;font-size:15px;line-height:1.5">${live.length?`${live.length} ${live.length===1?'сценарій потребує':'сценарії потребують'} уваги.`:'Підтверджених планів немає — «сьогодні без входу» теж рішення.'}
      ${watch.length?` Під спостереженням: ${watch.length}.`:''}</p>
      <div class="mut" style="margin-top:6px">Сценарій ≠ позиція. Ордерів офіс не відкриває.</div>
    </div>
    <div class="grid">
      <div class="kpi"><div class="mut">BTC</div><b class="num">${esc(una(b.price))}</b><div class="mut num ${ch>0?'L':(ch<0?'S':'')}">${esc(chTxt)} · 24h</div></div>
      <div class="kpi"><div class="mut">Сесія</div><b>${esc(una(se.active))}</b><div class="mut">далі ${esc(una(se.next))}${se.next_in_min!=null?` · ${esc(se.next_in_min)} хв`:''}</div></div>
      <div class="kpi"><div class="mut">Режим</div><b>${esc(d.market_regime||'Не визначено')}</b><div class="mut">${d.market_regime?'BTC · з Worker':'немає даних режиму'}</div></div>
    </div>
    ${sessionHtml(ses)}
    <h2>Що відстежує Лев</h2>
    <div class="card" id="watchbox"><div class="mut">Завантажую…</div></div>
    <h2>Запитати Лева</h2>
    <div class="card frm" id="levbox">
      <div class="mut">Відповідь — лише з живого аналізу Лева й журналу. «NO TRADE» — нормальна відповідь.</div>
      <label for="levsym">Символ (порожньо = BTCUSDT)</label>
      <input id="levsym" type="text" inputmode="text" autocomplete="off" placeholder="BTC, SOL, ETHUSDT" value="${esc(S.levsym||'')}">
      <div class="chips" id="levq" style="margin-top:8px">
        <button data-q="аналіз">Аналіз</button><button data-q="план">План і рівні</button><button data-q="що чекаєш">Що чекає</button>
        <button data-q="інвалідація">Скасування</button><button data-q="що змінилось">Що змінилось</button></div>
      <pre id="levout" class="mut" style="white-space:pre-wrap;font:inherit;font-size:13px;margin:8px 0 0" aria-live="polite"></pre>
    </div>
    <h2>Активні сценарії</h2>
    ${live.map(scCard).join('')||'<div class="empty">Немає активних планів Лева</div>'}
    ${watch.length?`<h2>Спостереження</h2>${watch.slice(0,4).map(scCard).join('')}`:''}
    ${odd.length?`<h2>Невідомий стан</h2>${odd.map(scCard).join('')}`:''}
    <h2>Стан даних</h2>
    <div class="card">${marks.map(m=>`<div class="kv"><span><span class="dot ${m.data_status==='DATA_OK'?'ok':'bad'}"></span> ${esc(m.symbol)}</span>
      <b>${m.data_status==='DATA_OK'?ago(m.as_of):(m.data_status==='STALE'?'застаріло · '+ago(m.as_of):'недоступно')}</b></div>`).join('')}
      ${(ov.unavailable||[]).length?`<div class="kv"><span>Не підключено</span><b>${esc((ov.unavailable||[]).join(', '))}</b></div>`:''}
    </div>`;
  bindCards();
  (async()=>{ const box=$('watchbox'); if(!box) return;
    try{ const r=await j('/api/v2/watches');
      if(!r.ok){ box.innerHTML='<div class="mut">Дані про відстеження недоступні.</div>'; return; }
      const w=(r.watches||[]).map(x=>`<div class="kv"><span><b>${esc(x.ticker)}</b> · ${esc(x.state_ua)}</span><b>зона ${esc(x.zone)} · скасування ${esc(x.invalidation)}</b></div>`).join('');
      const h=(r.recent||[]).map(x=>`<div class="mut">${hhmm(x.ts)} · ${esc(x.headline)}${x.sent?'':' · (не надсилалось в Telegram)'}</div>`).join('');
      box.innerHTML=(w||'<div class="mut">Зараз нічого не відстежується. Спитай Лева про монету — і якщо він скаже «чекаємо», він збереже умову.</div>')
        +(h?'<div class="mut" style="margin-top:8px">Що вже змінювалось:</div>'+h:'')
        +`<div class="mut" style="margin-top:8px">${r.notify_enabled?'Лев пише в Telegram, коли ситуація змінюється.':'Сповіщення в Telegram ще не ввімкнено — зміни видно тут.'}</div>`;
    }catch(e){ if(!e.stale) box.innerHTML='<div class="mut">Немає зв’язку із сервером.</div>'; }
  })();
  const lq=$('levq');
  if(lq) lq.querySelectorAll('[data-q]').forEach(b=>b.onclick=async()=>{
    const sym=($('levsym').value||'').trim(); S.levsym=sym; const out=$('levout'); out.textContent='Лев рахує на свіжих свічках…';
    try{ const r=await j('/api/v2/lev?q='+encodeURIComponent(b.dataset.q)+'&symbol='+encodeURIComponent(sym));
      out.textContent=r.ok?r.text:('Лев не відповів: '+(r.reason||'помилка')+'. Це NO TRADE, доки немає даних.'); }
    catch(e){ if(!e.stale) out.textContent='Немає зв’язку із сервером. Це NO TRADE, доки немає даних.'; }
  });
}

const TEST_UA={SWEEP:'свіп — вийшли й повернулись',ACCEPTED:'прийняття за рівнем',NOT_TESTED:'не тестували'};
function sessionHtml(b){
  if(!b) return '';
  if(b.data_status!=='DATA_OK') return `<h2>План сесії · BTC</h2><div class="card mut">Дані для плану сесії недоступні${b.reason?': '+esc(b.reason):''}</div>`;
  const p=b.previous||{}, c=b.current, sp=b.since_previous||{};
  const t=(x,lvl)=>x?`<div class="kv"><span>${lvl}</span><b>${esc(TEST_UA[x.state]||x.state)}${x.at?` · ${hhmm(x.at)}`:''}</b></div>`:'';
  return `<h2>План сесії · BTC${b.fixture?' · FIXTURE':''}</h2>
    <div class="card">
      <div class="kv"><span>Попередня: ${esc(p.name)}</span><b class="num">${esc(p.low_display)}–${esc(p.high_display)}</b></div>
      ${c&&c.high_display?`<div class="kv"><span>Поточна: ${esc(c.name)}</span><b class="num">${esc(c.low_display)}–${esc(c.high_display)}</b></div>`:''}
      ${t(sp.high_test,'High попередньої')}${t(sp.low_test,'Low попередньої')}
      <div class="mut" style="margin-top:6px">Спостереження, не сигнал. Свіп ≠ автоматичний розворот.</div>

let poll=null, chart=null, series=null, usingLW=false;
function killPoll(){ if(poll){clearInterval(poll); poll=null;} }
function priceFormat(tick){
  const t=Number(tick); if(!(t>0)) return {type:'price',precision:6,minMove:0.000001};
  const p=Math.max(0,Math.min(10,(String(tick).split('.')[1]||'').replace(/0+$/,'').length));
  return {type:'price',precision:p,minMove:t};
}
function drawFallback(el, candles, lv, cx){
  const c=document.createElement('canvas'); c.width=(el.clientWidth||320)*2; c.height=(el.clientHeight||320)*2;
  c.style.width='100%'; c.style.height='100%'; el.innerHTML=''; el.appendChild(c);
  const ctx=c.getContext('2d'); const w=c.width,h=c.height, pad=40;
  const xs=candles.filter(x=>x.time);
  if(!xs.length){ctx.fillStyle='#94A3B8'; ctx.fillText('немає свічок',20,40); return;}
  let mn=Math.min(...xs.map(x=>x.low)), mx=Math.max(...xs.map(x=>x.high));
  Object.values(lv).forEach(v=>{if(v!=null){mn=Math.min(mn,v); mx=Math.max(mx,v);}});
  if(cx&&cx.channel){['mid','upper','lower'].forEach(k=>['_start','_end'].forEach(e=>{const v=cx.channel[k+e]; if(v!=null){mn=Math.min(mn,v); mx=Math.max(mx,v);}}));}
  const x=i=>pad+(w-2*pad)*i/Math.max(xs.length-1,1);
  const y=v=>h-pad-(h-2*pad)*(v-mn)/Math.max(mx-mn,1e-9);
  ctx.fillStyle='#0E141D'; ctx.fillRect(0,0,w,h);
  if(lv.zone_lo!=null && lv.zone_hi!=null){ctx.fillStyle='rgba(93,169,255,.16)'; ctx.fillRect(pad,y(lv.zone_hi),w-2*pad,y(lv.zone_lo)-y(lv.zone_hi));}
  ctx.lineWidth=2;
  [['sl','#F36B78'],['tp1','#27C99A'],['tp2','#27C99A'],['tp3','#27C99A'],['entry','#E8EDF4']].forEach(([k,col])=>{
    if(lv[k]==null) return; ctx.strokeStyle=col; ctx.beginPath(); ctx.moveTo(pad,y(lv[k])); ctx.lineTo(w-pad,y(lv[k])); ctx.stroke();});
  const chn=cx&&cx.channel;
  if(chn){
    const ix=t=>{let k=0; for(let i=0;i<xs.length;i++){ if(xs[i].time<=t) k=i; } return k;};
    const a=ix(chn.start_time), b=ix(chn.end_time);
    [['mid','#7DA7D9',[]],['upper','#5C7FA8',[8,6]],['lower','#5C7FA8',[8,6]]].forEach(([k,col,dash])=>{
      ctx.strokeStyle=col; ctx.setLineDash(dash); ctx.lineWidth=2; ctx.beginPath();
      ctx.moveTo(x(a),y(chn[k+'_start'])); ctx.lineTo(x(b),y(chn[k+'_end'])); ctx.stroke();});
    ctx.setLineDash([]);
  }
  xs.forEach((b,i)=>{const up=b.close>=b.open; ctx.strokeStyle=ctx.fillStyle=up?'#27C99A':'#F36B78';
    ctx.beginPath(); ctx.moveTo(x(i),y(b.high)); ctx.lineTo(x(i),y(b.low)); ctx.stroke();
    const top=y(Math.max(b.open,b.close)), bot=y(Math.min(b.open,b.close)); ctx.fillRect(x(i)-2,top,4,Math.max(2,bot-top));});
}
function chartLevels(s){
  const L=S.layers, o={};
  if(L.zone){o.zone_lo=s.zone_lo; o.zone_hi=s.zone_hi;}
  if(L.sl) o.sl=s.sl;
  if(L.tp){o.tp1=s.tp1; o.tp2=s.tp2; o.tp3=s.tp3;}
  if(L.tp&&s.entry_px!=null) o.entry=s.entry_px;
  return o;
}
async function paintChart(el, s){
  const symbol=s.symbol, tf=S.tf, lv=chartLevels(s);
  let pack; try{pack=await j(`/api/v2/candles?symbol=${encodeURIComponent(symbol)}&tf=${tf}&limit=180`);}
  catch(e){if(e.stale) return null; el.innerHTML='<div class="empty">Свічки недоступні — графік не показуємо</div>'; setHealth('bad','немає свічок'); return null;}
  const stamp=$('asof'); if(stamp) stamp.textContent=pack.as_of?`Остання свічка: ${hhmm(pack.as_of)} · ${pack.fixture?'FIXTURE, не ринок':pack.source}`:'';
  setHealth(pack.data_status==='DATA_OK'?(pack.fixture?'warn':'ok'):'bad',
    pack.data_status==='DATA_OK'?(pack.fixture?'fixture':'оновлення '+pack.quote_mode):(pack.data_status==='STALE'?'дані застарілі':'дані недоступні'));
  if(stamp && pack.data_status==='STALE') stamp.textContent+=' · фід застарів — рівні не підтверджують вхід';
  const candles=(pack.candles||[]).filter(c=>c.time);
  S.lastBar=candles.length?candles[candles.length-1].time:0;
  if(chart){try{chart.remove();}catch(e){} chart=null; series=null;}
  el.innerHTML='';
  if(!candles.length){ el.innerHTML='<div class="empty">Свічки недоступні — графік не live</div>'; return pack; }
  if(window.LightweightCharts){
    usingLW=true;
    chart=LightweightCharts.createChart(el,{layout:{background:{color:'#0E141D'},textColor:'#94A3B8'},
      grid:{vertLines:{color:'#18212E'},horzLines:{color:'#18212E'}},rightPriceScale:{borderColor:'#243244'},
      timeScale:{borderColor:'#243244',timeVisible:true},crosshair:{mode:0},localization:{locale:'uk-UA'},height:el.clientHeight||320,width:el.clientWidth||320});
    series=chart.addCandlestickSeries({upColor:'#27C99A',downColor:'#F36B78',borderVisible:false,wickUpColor:'#27C99A',wickDownColor:'#F36B78',
      priceFormat:priceFormat((s.display||{}).tick)});
    series.setData(candles.map(c=>({time:c.time,open:c.open,high:c.high,low:c.low,close:c.close})));
    const vol=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:''});
    vol.priceScale().applyOptions({scaleMargins:{top:.85,bottom:0}});
    vol.setData(candles.map(c=>({time:c.time,value:c.volume||0,color:'#243244'})));
    const line=(p,color,title,style)=>{if(p!=null) series.createPriceLine({price:p,color,title,lineStyle:style||0,lineWidth:1});};
    line(lv.zone_lo,'#5DA9FF','зона',2); line(lv.zone_hi,'#5DA9FF','зона',2);
    line(lv.sl,'#F36B78','SL'); line(lv.tp1,'#27C99A','TP1'); line(lv.tp2,'#27C99A','TP2',2); line(lv.tp3,'#27C99A','TP3',2); line(lv.entry,'#E8EDF4','вхід',1);
    /* Лише те, що потрібно для ручної угоди: канал, FVG і сильна свічка (коли актуальні для цього сценарію), PDH/PDL (коли це ціль/межа).
       OB, дзеркальні й інші внутрішні рівні Лев враховує всередині — на графік не виводимо. */
    const shown=['зона','SL','TP'];
    let cx=null;
    if(S.layers.ch||S.layers.ctx){
      try{
        const q=new URLSearchParams({symbol,tf,dir:String(s.direction||'').toUpperCase(),zlo:s.zone_lo==null?'':s.zone_lo,zhi:s.zone_hi==null?'':s.zone_hi});
        ['tp1','tp2','tp3'].forEach(k=>{if(s[k]!=null) q.set(k,s[k]);});
        cx=await j('/api/v2/chart_context?'+q.toString());
      }catch(e){ if(e&&e.stale) return null; cx=null; }
    }
    const lastT=candles[candles.length-1].time;
    const seg=(t0,v0,t1,v1,o)=>{const ln=chart.addLineSeries(Object.assign({color:'#8392A5',lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false},o));
      ln.setData(t0===t1?[{time:t0,value:v0}]:[{time:t0,value:v0},{time:t1,value:v1}]); return ln;};
    if(cx&&cx.ok&&S.layers.ch&&cx.channel){
      const c=cx.channel;
      seg(c.start_time,c.mid_start,c.end_time,c.mid_end,{color:'#7DA7D9',lineWidth:2});
      seg(c.start_time,c.upper_start,c.end_time,c.upper_end,{color:'#6F96C4',lineWidth:1,lineStyle:2});
      seg(c.start_time,c.lower_start,c.end_time,c.lower_end,{color:'#6F96C4',lineWidth:1,lineStyle:2});
      shown.push('канал');
    }
    if(cx&&cx.ok&&S.layers.ctx){
      if(cx.fvg){
        seg(cx.fvg.from_time,cx.fvg.hi,lastT,cx.fvg.hi,{color:'#B48CFF',lineStyle:2,title:'FVG',lastValueVisible:true});
        seg(cx.fvg.from_time,cx.fvg.lo,lastT,cx.fvg.lo,{color:'#B48CFF',lineStyle:2});
        shown.push('FVG');
      }
      if(cx.strong_candle){
        const sc=cx.strong_candle, long_=String(s.direction||'').toUpperCase()!=='SHORT';
        series.setMarkers([{time:sc.time,position:long_?'belowBar':'aboveBar',color:'#4DB8F3',shape:long_?'arrowUp':'arrowDown',text:'Сильна свічка'}]);
        seg(sc.time,sc.ote_hi,lastT,sc.ote_hi,{color:'#4DB8F3',lineStyle:2,title:'відкат 62–79%',lastValueVisible:true});
        seg(sc.time,sc.ote_lo,lastT,sc.ote_lo,{color:'#4DB8F3',lineStyle:2});
        shown.push('сильна свічка');
      }
      Object.entries(cx.previous||{}).forEach(([k,v])=>{series.createPriceLine({price:v,color:'#E0B84D',title:k,lineStyle:1,lineWidth:1}); shown.push(k);});
    }
    window.__chartLayers=shown; S.cx=cx;
    chart.timeScale().fitContent();
  } else { usingLW=false; let cx=null; if(S.layers.ch){ try{ const q=new URLSearchParams({symbol,tf}); cx=await j('/api/v2/chart_context?'+q.toString()); }catch(e){ if(e&&e.stale) return null; } } drawFallback(el,candles,lv,cx); window.__chartLayers=['зона','SL','TP'].concat(cx&&cx.channel?['канал']:[]); }
  return pack;
}

    ${hm.now?`<div class="sec"><h3>Зараз</h3>
      ${hm.now.eligible===true?'<p>Вхід за цим планом ще можна розглядати.</p>':hm.now.eligible===false?`<p>Новий вхід зараз не розглядати: ${hm.now.reasons.map(esc).join('; ')}.</p>`:'<p>Чи можна входити зараз — не перевірено (немає свіжої ціни).</p>'}
      ${hm.now.rr_net!=null?`<div class="mut">RR від поточної ціни ${esc(hm.now.price||'')}: до TP1 ${Number(hm.now.rr_net).toFixed(2)}${hm.now.rr_weighted!=null?` · зважений ${Number(hm.now.rr_weighted).toFixed(2)}`:''}. Це не скасовує сигнал, який уже було підтверджено.</div>`:''}</div>`:''}
    ${hm.wait?`<div class="sec"><h3>Чого чекаємо</h3><p>${esc(hm.wait)}</p></div>`:''}
    ${hm.cancel?`<div class="sec"><h3>Що скасує план</h3><p>${esc(hm.cancel)}</p></div>`:''}
    ${hm.plan?`<div class="sec"><h3>План угоди</h3>${kv('Вхід',hm.plan.entry+(hm.plan.max_entry?` (не ${hm.action_ua==='Продаж'?'нижче':'вище'} ${hm.plan.max_entry})`:''))}${kv('Стоп',hm.plan.stop,'S')}${kv('Ціль 1',hm.plan.tp1,'L')}${kv('Ціль 2',hm.plan.tp2,'L')}${kv('Ціль 3',hm.plan.tp3,'L')}
      ${hm.size&&hm.size.usdt?`<div class="kv"><span>Позиція</span><b>${esc(Math.round(hm.size.usdt))} USDT · ризик ${esc(Math.round(hm.size.risk_usd))} $</b></div>`:''}
      <div class="mut" style="margin-top:6px">${esc(hm.plan.potential)}</div>${hm.plan.valid_until?`<div class="mut" style="margin-top:6px">Увійти за планом можна до ${esc(hm.plan.valid_until)} (Київ) — верхня межа; раніше знімається, якщо ідея зламана (закриття H1 за рівнем, злам структури, ціль без входу, ціна за межею входу).</div>`:''}</div>`:''}
    ${hm.prelim?`<div class="sec"><h3>Попередньо. Не для входу</h3>${hm.prelim.map(x=>`<div class="mut">${esc(x)}</div>`).join('')}<div class="mut" style="margin-top:6px">${esc(hm.prelim_note)}</div></div>`:''}
    ${hm.context?`<div class="sec"><h3>Що ще перевірив Лев</h3>${(hm.context.notes||[]).map(x=>`<div class="mut">${esc(x.text)}</div>`).join('')}
      ${(hm.context.unchecked||[]).length?`<div class="mut" style="margin-top:6px">Не вдалося перевірити: ${esc(hm.context.unchecked.join(', '))}.</div>`:''}
      ${(hm.context.sources||[]).length?`<div class="mut" style="margin-top:8px">Джерела даних:</div>`+(hm.context.sources||[]).map(x=>`<div class="kv"><span><span class="dot ${x.state==='on'?'ok':'warn'}"></span> ${esc(x.name)}</span><b>${x.state==='on'?'підключено':'вимкнено'}</b></div><div class="mut" style="margin:0 0 6px">${esc(x.text)}</div>`).join(''):`<div class="mut" style="margin-top:6px">Лев поки не бачить: ${esc((hm.context.not_connected||[]).join(', '))}.</div>`}
      ${(hm.context.freshness||[]).length?`<div class="mut" style="margin-top:6px">Дані станом на: ${(hm.context.freshness||[]).map(f=>esc(f.name)+' — '+(f.as_of&&f.fresh?new Date(f.as_of*1000).toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'}):'немає свіжих')).join('; ')}.</div>`:''}
      <div class="mut" style="margin-top:6px">${esc(hm.context.rule_note||'')}</div></div>`:''}
    ${hm.news?`<div class="sec"><h3>Новини</h3>${newsHtml(hm.news)}</div>`:''}
    ${hm.next?`<div class="sec"><h3>Що Лев зробить далі</h3><p>${esc(hm.next)}</p></div>`:''}
    ${(hm.history||[]).length?`<div class="sec"><h3>Що було</h3><div class="tl">${hm.history.map(x=>`<div><span class="mut num">${hhmm(x.ts)}</span> — ${esc(x.text)}</div>`).join('')}</div></div>`:''}`
    :`<div class="card err"><b>Не вдалося скласти зрозумілий висновок</b><div class="mut">Технічні дані нижче, у розділі «Для перевірки». Не вважай цей сценарій готовим планом.</div></div>`;
  app.innerHTML=`<button class="back" id="back" aria-label="Назад до сценаріїв">← Сценарії</button>
    ${humanHtml}
    <details class="dbg"><summary>Для перевірки (технічні дані)</summary>
    <div class="card">
      <div class="top"><span class="sym">${esc(s.symbol)}</span><span class="side ${side(s.direction)}">${sideTxt(s.direction)}</span>${pill(st)}</div>
      <div style="margin-top:6px;font-size:14px">${esc(st.text||'')}</div>
      <div class="mut" style="margin-top:4px">${esc(s.timeframe||'')} · оновлено ${ago(s.as_of)} · ID ${esc(s.scenario_id)}</div>
    </div>
    <div class="sec"><h3>Висновок Лева</h3><p>${esc(s.why||story||'Лев не залишив пояснення в записі сценарію.')}</p>
      ${s.why&&story?`<div class="mut" style="margin-top:6px">${esc(story)}</div>`:''}</div>
    ${thesisHtml(d.thesis)}
    <div class="sec"><h3>Торговий план (сирий розрахунок)</h3>
      ${kv('Зона входу',dp.zone||dp.entry)}${kv('Стоп',dp.sl,'S')}${kv('TP1',dp.tp1,'L')}${dp.tp2?kv('TP2',dp.tp2,'L'):''}
      ${kv('RR',dp.rr?`${dp.rr} (${dp.rr_basis})`:'')}${kv('Потенціал до TP1',dp.potential)}
    </div>
    ${execHtml(d.execution)}
    <div class="sec"><h3>Журнал подій</h3>${ev?`<div class="tl">${ev}</div>`:'<div class="mut">Подій у журналі ще немає.</div>'}</div>
    </details>
    <div class="acts" style="margin:0 0 10px"><button class="btn" id="iopen">Я відкрила угоду за цим сценарієм</button></div>
    ${chips(['M1','M5','M15','H1','H4','D1'].map(t=>[t,t]),S.tf,'tf')}
    <div class="chips" id="lay">
      <button data-l="zone" class="${S.layers.zone?'on':''}" aria-pressed="${S.layers.zone}">Зона</button>
      <button data-l="sl" class="${S.layers.sl?'on':''}" aria-pressed="${S.layers.sl}">SL</button>
      <button data-l="tp" class="${S.layers.tp?'on':''}" aria-pressed="${S.layers.tp}">TP</button>
      <button data-l="ch" class="${S.layers.ch?'on':''}" aria-pressed="${S.layers.ch}">Канал</button>
      <button data-l="ctx" class="${S.layers.ctx?'on':''}" aria-pressed="${S.layers.ctx}">FVG і сильна свічка</button>
      <button id="fs" aria-label="Графік на весь екран">⤢ Повний екран</button></div>
    <div id="chart" class="chart"></div>
    <div class="mut" id="asof" style="margin:6px 0 12px"></div>
`;
  $('back').onclick=()=>{killPoll(); go('scenarios');};
  $('iopen').onclick=()=>{killPoll(); S.jkind='trades'; S.prefill={symbol:s.symbol,direction:String(s.direction||'').toUpperCase(),scenario_id:s.scenario_id,
    sl:s.sl==null?'':String(s.sl),tp1:s.tp1==null?'':String(s.tp1),tp2:s.tp2==null?'':String(s.tp2)}; go('journal');};
  const el=$('chart');
  await paintChart(el, s);
  app.querySelectorAll('[data-tf]').forEach(b=>b.onclick=async()=>{
    S.tf=b.dataset.tf; lsSet('ao_tf',S.tf);
    app.querySelectorAll('[data-tf]').forEach(x=>x.classList.toggle('on',x===b)); await paintChart(el,s);});
  app.querySelectorAll('[data-l]').forEach(b=>b.onclick=async()=>{
    S.layers[b.dataset.l]=!S.layers[b.dataset.l]; if(b.dataset.l==='ch') lsSet('ao_ch2',S.layers.ch?'1':'0'); if(b.dataset.l==='ctx') lsSet('ao_ctx',S.layers.ctx?'1':'0'); b.classList.toggle('on',S.layers[b.dataset.l]); b.setAttribute('aria-pressed',String(S.layers[b.dataset.l])); await paintChart(el,s);});
  $('fs').onclick=()=>{el.classList.toggle('full'); if(chart) chart.applyOptions({width:el.clientWidth,height:el.clientHeight});};
  poll=setInterval(async()=>{
    if(document.hidden) return;
    let pack; try{pack=await j(`/api/v2/candles?symbol=${encodeURIComponent(s.symbol)}&tf=${S.tf}&limit=180`);}catch(e){if(!e.stale) setHealth('bad','немає зв’язку'); return;}
    const last=(pack.candles||[]).slice(-1)[0];
    if(!last||!last.time) return;
    if(last.time>S.lastBar) { await paintChart(el,s); return; }
    if(usingLW && series) series.update({time:last.time,open:last.open,high:last.high,low:last.low,close:last.close});
    else paintChart(el,s);
  }, 8000);
}

const routes={office,radar,scenarios,journal,risk};
let cur='office';
function go(r){
  killPoll(); cur=r;
  document.querySelectorAll('nav button').forEach(x=>{const on=x.dataset.r===r; x.classList.toggle('on',on); if(on) x.setAttribute('aria-current','page'); else x.removeAttribute('aria-current');});
  routes[r]();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.r));
const qs=new URLSearchParams(location.search);
if(qs.get('scenario')) openSc(qs.get('scenario')); else go('office');
</script>
</body>
</html>
