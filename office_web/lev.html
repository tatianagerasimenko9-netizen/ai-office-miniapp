<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080F1B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI Office">
<link rel="manifest" href="/lev/manifest.webmanifest">
<link rel="apple-touch-icon" href="/lev/icon-180.png">
<link rel="icon" type="image/png" href="/lev/icon-192.png">
<title>AI Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#080F1B;--panel:#111C2C;--deep:#0B1524;--gold:#D8B66A;--text:#F7F5F0;--muted:#A7AAB2;--line:rgba(216,182,106,.16);--up:#5FD39A;--down:#F4A08F;--warn:#F2C75C;--upbg:rgba(95,211,154,.13);--downbg:rgba(244,160,143,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Montserrat',system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100vh;max-width:560px;margin:0 auto}
button{font-family:inherit;color:inherit;cursor:pointer}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 16px 10px}
.brand{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;font-weight:600;color:var(--gold);line-height:.9;display:flex;flex-direction:column;align-items:center}.brand small{font-family:'Montserrat',sans-serif;font-size:8px;font-weight:600;letter-spacing:.32em;margin:3px 0 0 .32em}
.live{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--up);flex-shrink:0}.dot.stale,.dot.red{background:var(--down)}.dot.yellow{background:var(--warn)}.dot.grey{background:#55617a}
main{padding:6px 16px 96px;display:flex;flex-direction:column;gap:14px}
.hide{display:none!important}
.card{background:var(--panel);border-radius:16px;padding:16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}
.up{color:var(--up)}.down{color:var(--down)}
h2{margin:6px 2px 0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.ava{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--gold);object-fit:cover;flex-shrink:0;background:var(--deep)}
/* головне число */
.hero{background:linear-gradient(160deg,#16263E 0%,#0F1A2B 100%);border:1px solid var(--line);border-radius:18px;padding:18px 16px 14px}
.hero .big{font-size:46px;font-weight:800;line-height:1;letter-spacing:-.02em}
.hero .lab{font-size:12px;color:var(--muted);margin-top:4px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.mini{background:rgba(8,15,27,.55);border-radius:12px;padding:10px 12px}
.mini b{display:block;font-size:19px;font-weight:700;line-height:1.2}
.say{display:flex;gap:10px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;font-weight:500;line-height:1.4}
/* увага */
.att{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:0;border-radius:14px;padding:12px 14px;min-height:56px}
.att.red{background:var(--downbg);box-shadow:inset 3px 0 0 var(--down)}.att.yellow{box-shadow:inset 3px 0 0 var(--warn)}
.att b{display:block;font-size:14px;font-weight:700}.att span.d{display:block;font-size:12px;color:var(--muted)}
.chev{color:var(--gold);font-size:18px;margin-left:auto}
/* фільтри */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid var(--line);background:transparent;border-radius:99px;padding:8px 13px;font-size:12px;font-weight:600;color:var(--muted);min-height:36px}
.chip.on{background:var(--gold);border-color:var(--gold);color:#17140E}
/* група */
.grp{background:var(--panel);border-radius:16px;overflow:hidden}
.grp>button{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:14px 16px;text-align:left;min-height:64px}
.grp .t{font-size:15px;font-weight:700}.grp .s{font-size:12px;color:var(--muted)}
.grp .sum{margin-left:auto;font-size:20px;font-weight:800}
.split{display:flex;height:5px;border-radius:3px;overflow:hidden;background:#1B2A40;margin-top:7px;width:120px}
.split i{background:var(--up)}.split u{background:var(--down)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 12px 14px}
.tile{border:0;border-radius:12px;padding:10px 8px;text-align:center;background:var(--deep);min-height:58px;position:relative}
.tile.up{background:var(--upbg)}.tile.down{background:var(--downbg)}
.tile .n{font-size:13px;font-weight:700;color:var(--text)}.tile .v{font-size:15px;font-weight:800}
.tile .f{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}
/* сигнали */
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;background:var(--panel);border-radius:14px;padding:5px}
.seg button{border:0;background:transparent;color:var(--muted);border-radius:10px;min-height:46px;font-size:12px;font-weight:700;letter-spacing:.03em}.seg button.on{background:var(--gold);color:#17140E}.seg small{margin-left:7px;font-size:11px;opacity:.75}
.pick{display:block;position:relative}.pick:after{content:'▾';position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--gold);pointer-events:none}
.pick select{width:100%;appearance:none;-webkit-appearance:none;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;min-height:46px;padding:0 40px 0 14px;font-family:inherit;font-size:14px;font-weight:600}
.stiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stile{border:1px solid transparent;border-radius:14px;padding:12px 6px 10px;background:var(--panel);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:104px}
.stile.up{background:var(--upbg)}.stile.down{background:var(--downbg)}.stile.live{background:var(--panel);border-color:var(--line)}
.stile .n{font-size:15px;font-weight:800;color:var(--text)}.stile .d{font-size:10px;color:var(--muted)}.stile .v{font-size:17px;font-weight:800;margin-top:4px}.stile .t{font-size:10px;color:var(--muted)}
.day{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 2px 0}
.sig{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:0;border-radius:14px;padding:12px 14px;min-height:58px}
.sig b{font-size:15px;font-weight:700}.sig .m{font-size:11px;color:var(--muted)}
.tag{margin-left:auto;font-size:11px;font-weight:700;padding:5px 9px;border-radius:99px;background:var(--deep);color:var(--muted);white-space:nowrap}
.tag.open{color:var(--up);background:var(--upbg)}.tag.sl{color:var(--down);background:var(--downbg)}.tag.tp{color:#0C1A12;background:var(--up)}
/* лист */
.shade{position:fixed;inset:0;background:rgba(3,7,14,.72);z-index:20;display:none;align-items:flex-end;justify-content:center}
.shade.on{display:flex}
.sheet{background:#0F1929;border-radius:22px 22px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:10px 16px calc(22px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.grab{width:42px;height:4px;border-radius:2px;background:#3a475e;margin:2px auto 12px}
.sheet h3{margin:0;font-size:22px;font-weight:800;line-height:1.15}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.three div{background:var(--deep);border-radius:12px;padding:10px}.three b{display:block;font-size:17px;font-weight:800;line-height:1.25}
.bar{position:relative;height:6px;border-radius:3px;background:#1B2A40;margin:6px 0 4px}
.bar i{position:absolute;left:0;top:0;height:6px;border-radius:3px;background:#345B8A}.bar u{position:absolute;top:-4px;width:2px;height:14px;background:var(--text)}
.kv{display:flex;justify-content:space-between;gap:14px;font-size:13px;padding:7px 0;border-top:1px solid rgba(216,182,106,.1)}
.kv span:first-child{color:var(--muted);flex-shrink:0}.kv span:last-child{text-align:right;font-weight:600}
.btn{min-height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:14px;font-weight:700;border:0;background:var(--gold);color:#17140E;padding:0 14px;width:100%}
.btn.ghost{background:transparent;color:var(--text);border:1px solid rgba(216,182,106,.35);font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.note{background:var(--deep);border-radius:12px;padding:12px;font-size:13px;line-height:1.5;margin-top:10px}
.note.warn{box-shadow:inset 3px 0 0 var(--warn)}
details{margin-top:10px}summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--gold);letter-spacing:.04em;padding:6px 0;list-style:none}summary::-webkit-details-marker{display:none}summary:after{content:' ▾'}details[open] summary:after{content:' ▴'}
p{margin:0}
nav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);background:rgba(11,21,36,.97);max-width:560px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{min-height:58px;background:none;border:0;border-top:2px solid transparent;font-size:11px;font-weight:600;color:var(--muted)}
nav button.on{color:var(--gold);border-top-color:var(--gold)}
</style>
</head>
<body>
<header><div class="brand">AI<small>OFFICE</small></div><div class="live"><span id="dot" class="dot stale"></span><span id="upd">завантаження…</span></div></header>

<main id="tab-today"></main>
<main id="tab-signals" class="hide"></main>
<main id="tab-invest" class="hide">
  <div class="card"><div class="row" style="justify-content:flex-start"><div><b style="font-size:16px">Портфель ще не підключено</b><div class="small muted">потрібен ключ «лише читання» або ручне введення</div></div></div></div>
  <h2>На чому стоятимуть поради</h2>
  <div class="card" style="padding:8px 16px">
    <div class="kv" style="border-top:0"><span>Біткоїн частинами щотижня</span><span class="up">$4 000 → $12 350</span></div>
    <div class="kv"><span>Стоп на споті</span><span>не допомагає</span></div>
    <div class="kv"><span>Гонитва за тим, що вистрілило</span><span class="down">−99%</span></div>
  </div>
  <div class="tiny muted">Наша перевірка: 664 монети, 2020–2026.</div>
</main>
<main id="tab-zvirka" class="hide"></main>

<div id="shade" class="shade"><div class="sheet" id="sheet"></div></div>

<nav>
  <button data-tab="today" class="on">Сьогодні</button><button data-tab="signals">Сигнали</button><button data-tab="invest">Інвестиції</button><button data-tab="zvirka">Звірка</button>
</nav>

<script>
(function(){
  try{ if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();} }catch(e){}
  var S=null,Z=null,frozen=false,F='all',SF='all',SK='TD',OPEN={};
  var $=function(id){return document.getElementById(id)};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function num(a){return String(Math.round(Math.abs(a))).replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
  function usd(x){if(x==null)return '—';var r=Math.round(x);return (r>0?'+':(r<0?'−':''))+'$'+num(r)}
  function cls(x){if(x==null)return 'muted';var r=Math.round(x);return r>0?'up':(r<0?'down':'')}
  function dec(){try{return JSON.parse(localStorage.getItem('lev_dec')||'{}')}catch(e){return{}}}
  function setDec(id,v){var d=dec();d[id]=v;try{localStorage.setItem('lev_dec',JSON.stringify(d))}catch(e){}}
  function all(){var a=[];S.groups.forEach(function(g){g.trades.forEach(function(t){a.push(t)})});return a}
  function find(id){var r=null;all().forEach(function(t){if(t.sig_id===id)r=t});return r}
  var FILT={all:function(){return true},plus:function(t){return t.now!=null&&Math.round(t.now)>0},minus:function(t){return t.now!=null&&Math.round(t.now)<0},soon:function(t){return t.soon},near:function(t){return t.near},
            short:function(t){return t.dir==='SHORT'},long:function(t){return t.dir==='LONG'},both:function(t){return t.both}};
  var FNAME={all:'Усі',plus:'У плюсі',minus:'У мінусі',soon:'Виходять сьогодні',near:'Біля стопа',short:'Шорти',long:'Лонги',both:'В обидва боки'};

  function tile(t){var c=cls(t.now);return '<button class="tile '+c+'" data-trade="'+esc(t.sig_id)+'">'+(t.near?'<span class="f" style="background:var(--down)"></span>':(t.soon?'<span class="f" style="background:var(--warn)"></span>':''))+'<div class="n">'+esc(t.sym)+'</div><div class="v '+c+'">'+(t.now==null?'—':usd(t.now))+'</div></button>'}

  function renderToday(){
    var s=S,T=all(),h='';
    h+='<div class="hero"><div class="row" style="align-items:flex-start"><div><div class="big '+cls(s.sums.now)+'">'+(s.sums.n?usd(s.sums.now):'$0')+'</div><div class="lab">зараз по '+s.sums.n+' відкритих угодах · не зафіксовано</div></div></div>';
    h+='<div class="pair"><div class="mini"><div class="tiny muted">якщо всі стопи</div><b class="down">'+(s.sums.n?usd(s.sums.if_stop):'—')+'</b></div><div class="mini"><div class="tiny muted">до стопів від зараз</div><b>'+(s.sums.n?'$'+num(s.sums.to_stop):'—')+'</b></div></div>';
    h+='<div class="say"><span>'+esc(s.lev)+'</span></div></div>';
    if(s.attention.length){h+='<h2>Потребує уваги</h2>';
      s.attention.forEach(function(a){h+='<button class="att '+esc(a.level)+'" data-filter="'+esc(a.filter)+'"><span class="dot '+esc(a.level)+'"></span><span><b>'+esc(a.title)+'</b><span class="d">'+esc(a.detail)+'</span></span><span class="chev" aria-hidden="true">›</span></button>'})}
    h+='<h2 id="trades">Відкриті угоди</h2>';
    if(!T.length){h+='<div class="card empty">Відкритих угод немає.</div>';$('tab-today').innerHTML=h;return}
    var order=['all','plus','minus','soon','near'];if(order.indexOf(F)<0)order.push(F);
    h+=sel('data-fs="1"',order.filter(function(k){return k==='all'||k===F||T.filter(FILT[k]).length}).map(function(k){return [k,FNAME[k]+' · '+T.filter(FILT[k]).length]}),F);
    if(F!=='all'){var L=T.filter(FILT[F]).sort(function(a,b){return (a.now==null)-(b.now==null)||(a.now-b.now)});
      h+='<div class="grp">'+(L.length?'<div class="tiles" style="padding-top:14px">'+L.map(tile).join('')+'</div>':'<div class="empty">Таких угод зараз немає.</div>')+'</div>'}
    else{s.groups.forEach(function(g,gi){var k=g.trades.filter(function(t){return t.now!=null}),p=k.filter(function(t){return Math.round(t.now)>0}).length,m=k.filter(function(t){return Math.round(t.now)<0}).length,o=OPEN[gi];
      h+='<div class="grp"><button data-g="'+gi+'"><span><div class="t">'+esc(g.title)+'</div><div class="s">'+p+' у плюсі · '+m+' у мінусі</div><div class="split"><i style="width:'+(g.n?100*p/g.n:0)+'%"></i><u style="width:'+(g.n?100*m/g.n:0)+'%"></u></div></span><span class="sum '+cls(g.now)+'">'+(g.now==null?'—':usd(g.now))+'</span><span class="chev" style="margin-left:0" aria-hidden="true">'+(o?'▴':'▾')+'</span></button>';
      if(o)h+='<div class="tiles">'+g.trades.map(tile).join('')+'</div>';h+='</div>'})}
    h+='<details><summary>Як я рахую</summary><p class="small muted">Ціни на '+esc(s.price_at||'—')+(s.stale?' (застаріли)':'')+'. Ризик $'+s.risk+' на угоду. '+esc(s.note)+(s.sums.unknown?' Без ціни зараз: '+s.sums.unknown+'.':'')+' Червона крапка на плитці — угода біля стопа, жовта — виходить сьогодні.</p></details>';
    $('tab-today').innerHTML=h;
  }

  function openTrade(id){
    var t=find(id);if(!t)return;frozen=true;
    var h='<div class="grab"></div><div class="row"><div><div class="tiny muted">'+esc(t.strat)+(t.seq?' №'+t.seq:'')+' · '+esc(t.age)+'</div><h3>'+esc(t.sym)+' · '+esc(t.dir_ua)+'</h3></div><div style="font-size:30px;font-weight:800" class="'+cls(t.now)+'">'+(t.now==null?'—':usd(t.now))+'</div></div>';
    if(t.near)h+='<div class="note warn" style="box-shadow:inset 3px 0 0 var(--down)">Біля стопа: до нього '+String(t.dist_pct).replace('.',',')+'%.</div>';
    if(t.soon)h+='<div class="note warn">Сьогодні виходить за часом: '+esc(t.exit_at)+'. Закрийте за ринком.</div>';
    h+='<div class="three"><div><div class="tiny muted">зараз</div><b class="'+cls(t.now)+'">'+(t.now==null?'—':usd(t.now))+'</b></div><div><div class="tiny muted">до стопа ще</div><b>'+(t.to_stop==null?'—':'$'+num(t.to_stop))+'</b></div><div><div class="tiny muted">якщо стоп</div><b class="down">'+usd(t.if_stop)+'</b></div></div>';
    if(t.pos!=null)h+='<div class="bar"><i style="width:'+(t.pos*100)+'%"></i><u style="left:'+(t.pos*100)+'%"></u></div><div class="row tiny muted" style="margin-bottom:8px"><span>стоп</span><span>ціль</span></div>';
    h+='<div class="kv"><span>Ціна зараз</span><span>'+(t.price?esc(t.price):'не бачу')+'</span></div><div class="kv"><span>Вхід</span><span>'+esc(t.entry)+'</span></div><div class="kv"><span>Стоп</span><span class="down">'+esc(t.sl)+'</span></div><div class="kv"><span>Ціль</span><span class="up">'+esc(t.tp)+(t.tp_usd?' · '+esc(t.tp_usd):'')+'</span></div><div class="kv"><span>Відкрито</span><span>'+esc(t.opened)+'</span></div><div class="kv"><span>Вихід за часом</span><span>'+esc(t.exit_at)+'</span></div>';
    var w=[t.pair,t.opp,t.rep?'повторний сигнал після стопа':null].filter(Boolean);if(w.length)h+='<div class="note warn">'+esc(w.join('. '))+'</div>';
    h+='<div class="two"><button class="btn" data-calm="'+esc(t.sig_id)+'">Мені тривожно</button><button class="btn ghost" data-close="1">Закрити</button></div>';
    show(h);
  }
  function openCalm(id){
    var t=find(id);if(!t)return;
    var h='<div class="grab"></div><div class="row" style="justify-content:flex-start"><div><h3>'+esc(t.sym)+' · '+esc(t.dir_ua)+'</h3><div class="tiny muted">знімок на '+esc(S.price_at||'—')+' · цифри не миготять</div></div></div>';
    if(t.now==null)h+='<div class="note">Ціну цієї монети я зараз не бачу, тому суми не покажу. Стоп за сигналом: '+esc(t.sl)+'.</div>';
    else h+='<div class="note" style="font-size:15px">До стопа <b>'+String(t.dist_pct).replace('.',',')+'%</b>. Стоп на '+esc(t.sl)+', ціна '+esc(t.price)+'.</div><div class="three"><div><div class="tiny muted">зараз</div><b class="'+cls(t.now)+'">'+usd(t.now)+'</b></div><div><div class="tiny muted">до стопа ще</div><b>$'+num(t.to_stop)+'</b></div><div><div class="tiny muted">якщо стоп</div><b class="down">'+usd(t.if_stop)+'</b></div></div>';
    h+='<div class="note" style="font-size:15px"><b>Ваш план:</b> угода закривається, коли настане одне з трьох — стоп '+esc(t.sl)+', ціль '+esc(t.tp)+' або час ('+esc(t.exit_at)+').'+(t.now!=null?' <b>Зараз жодна умова не настала.</b>':'')+'</div>';
    h+='<details><summary>На чому це базується</summary><div class="kv"><span>Ціна</span><span>'+esc(t.price||'немає')+' · '+esc(S.price_at||'—')+'</span></div><div class="kv"><span>Вхід і стоп</span><span>'+esc(t.entry)+' · '+esc(t.sl)+'</span></div><div class="kv"><span>Схожі рухи на історії</span><span>ще не пораховано</span></div><p class="tiny muted" style="margin-top:6px">'+esc(S.note)+'</p></details>';
    h+='<div class="two"><button class="btn ghost" data-trade="'+esc(t.sig_id)+'">Назад до угоди</button><button class="btn" data-close="1">Згорнути</button></div>';
    show(h);
  }

  function sel(attr,opts,cur){var h='<label class="pick"><select '+attr+'>';opts.forEach(function(o){h+='<option value="'+o[0]+'"'+(o[0]===cur?' selected':'')+'>'+esc(o[1])+'</option>'});return h+'</select></label>'}
  function sres(x){if(x.kind==='open'){var t=find(x.sig_id);return t?t.now:null}return x.res}
  function renderSignals(){
    var A=S.signals,h='',K={TD:A.filter(function(x){return x.strat==='ІНТРАДЕЙ'}),SW:A.filter(function(x){return x.strat==='СВІНГ'}),BN:A.filter(function(x){return x.strat==='ВІДСКОК'})};
    h+='<div class="seg"><button class="'+(SK==='TD'?'on':'')+'" data-sk="TD">ІНТРАДЕЙ<small>'+K.TD.length+'</small></button><button class="'+(SK==='SW'?'on':'')+'" data-sk="SW">СВІНГ<small>'+K.SW.length+'</small></button><button class="'+(SK==='BN'?'on':'')+'" data-sk="BN">ВІДСКОК<small>'+K.BN.length+'</small></button></div>';
    var SFF={all:function(){return true},open:function(x){return x.kind==='open'},plus:function(x){return x.kind!=='open'&&x.res>0},minus:function(x){return x.kind!=='open'&&x.res<0}};
    var B=K[SK];h+=sel('data-sfs="1"',[['all','Усі сигнали · '+B.length],['open','Зараз відкриті · '+B.filter(SFF.open).length],['plus','Закриті в плюс · '+B.filter(SFF.plus).length],['minus','Закриті в мінус · '+B.filter(SFF.minus).length]],SF);
    var L=B.filter(SFF[SF]),day='',sum=0,open=false;if(!L.length)h+='<div class="card empty">За 48 годин таких сигналів немає.</div>';
    L.forEach(function(x){var d=x.at.slice(0,5);if(d!==day){if(open)h+='</div>';day=d;h+='<div class="day">'+esc(d)+'</div><div class="stiles">';open=true}
      var v=sres(x),c=cls(v),ic=x.kind==='tp'?'✓ ':'',me=dec()[x.sig_id];if(v!=null)sum+=v;
      h+='<button class="stile '+(x.kind==='open'?'live ':'')+c+'" data-sigid="'+esc(x.sig_id)+'"><span class="n">'+esc(x.sym)+'</span><span class="d">'+(x.dir==='LONG'?'▲ лонг':'▼ шорт')+'</span><span class="v '+c+'">'+(v==null?'—':ic+usd(v))+'</span><span class="t">'+(x.kind==='open'?'йде зараз':(x.kind==='tp'?'тейк':(x.kind==='sl'?'стоп':esc(x.status))))+(me==='took'?' · взяла':'')+'</span></button>'});
    if(open)h+='</div>';
    if(L.length)h+='<div class="card row"><span class="muted">Разом за 48 годин</span><b class="'+cls(sum)+'" style="font-size:18px">'+usd(sum)+'</b></div>';
    $('tab-signals').innerHTML=h;
  }
  function openSignal(id){
    var x=null;S.signals.forEach(function(q){if(q.sig_id===id)x=q});if(!x)return;frozen=true;
    var h='<div class="grab"></div><div class="row"><div><div class="tiny muted">'+esc(x.strat)+(x.seq?' №'+x.seq:'')+' · '+esc(x.at)+'</div><h3>'+esc(x.sym)+' · '+esc(x.dir_ua)+'</h3></div><span class="tag '+(x.status==='стоп'?'sl':(x.status==='ціль'?'tp':(x.open?'open':'')))+'">'+esc(x.status)+'</span></div>';
    h+='<div class="three"><div><div class="tiny muted">вхід</div><b>'+esc(x.entry)+'</b></div><div><div class="tiny muted">стоп · −$'+S.risk+'</div><b class="down">'+esc(x.sl)+'</b></div><div><div class="tiny muted">ціль · '+esc(x.tp_usd)+'</div><b class="up">'+esc(x.tp)+'</b></div></div>';
    h+='<div class="row" style="justify-content:flex-start;margin-top:4px"><b style="font-size:16px;line-height:1.3">'+esc(x.lev.title)+'</b></div>';
    if(x.lev.cautions.length)x.lev.cautions.forEach(function(c){h+='<div class="note warn">'+esc(c)+'</div>'});
    h+='<div class="note">'+esc(x.lev.after)+'</div>';
    h+='<details><summary>На що я дивився</summary>';x.lev.facts.forEach(function(f){h+='<div class="kv"><span>'+esc(f[0])+'</span><span>'+esc(f[1])+'</span></div>'});h+='</details>';
    var d=dec()[x.sig_id];
    h+='<div class="two"><button class="btn'+(d==='took'?'':' ghost')+'" data-dec="took" data-id="'+esc(x.sig_id)+'">Взяла</button><button class="btn'+(d==='skip'?'':' ghost')+'" data-dec="skip" data-id="'+esc(x.sig_id)+'">Пропустила</button></div><div class="tiny muted" style="margin-top:8px;text-align:center">Рішення за вами. Позначка зберігається лише на цьому телефоні.</div>';
    show(h);
  }
  function show(h){$('sheet').innerHTML=h;$('shade').classList.add('on');$('sheet').scrollTop=0}
  function hide(){$('shade').classList.remove('on');frozen=false;render()}

  function renderZvirka(){
    if(!Z){$('tab-zvirka').innerHTML='<div class="card empty">Завантаження…</div>';return}
    var prom={'СВІНГ':'+$1,30','ІНТРАДЕЙ':'+$1,00'},h='<h2>Обіцяв і вийшло</h2>';
    Z.rows.forEach(function(r){var n=r.sl+r.tp+r.time,per=n?r.closed_usd/n:null;
      h+='<div class="card"><div class="row"><div><b style="font-size:16px">'+esc(r.name)+'</b><div class="tiny muted">з '+esc((r.since||'—').slice(0,5))+' · закрито '+n+'</div></div><div style="font-size:26px;font-weight:800" class="'+cls(r.closed_usd)+'">'+usd(r.closed_usd)+'</div></div>';
      h+='<div class="three"><div><div class="tiny muted">обіцяв на угоду</div><b>'+prom[r.name]+'</b></div><div><div class="tiny muted">вийшло на угоду</div><b class="'+cls(per)+'">'+(per==null?'—':usd(per))+'</b></div><div><div class="tiny muted">відкрито '+r.open+'</div><b class="'+cls(r.open_usd)+'">'+usd(r.open_usd)+'</b></div></div>';
      h+='<details><summary>Подробиці</summary><div class="kv"><span>Стоп / ціль / за часом</span><span>'+r.sl+' / '+r.tp+' / '+r.time+'</span></div>'+(r.time_unknown?'<div class="kv"><span>За часом без ціни виходу</span><span>'+r.time_unknown+' (не враховані)</span></div>':'')+(r.open_unknown?'<div class="kv"><span>Відкриті без ціни</span><span>'+r.open_unknown+'</span></div>':'')+'</details></div>'});
    h+='<div class="tiny muted">Ризик $'+Z.risk+' на угоду, без комісії. Оновлено '+esc(Z.updated)+'.</div>';
    $('tab-zvirka').innerHTML=h;
  }

  function render(){if(!S)return;$('upd').textContent=(S.stale?'дані застаріли · ':'наживо · ')+S.updated;$('dot').className='dot'+(S.stale?' stale':'');renderToday();renderSignals()}
  function load(){fetch('/api/lev/state',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){if(j&&j.ok){S=j;if(!frozen)render()}}).catch(function(){$('upd').textContent='немає звʼязку';$('dot').className='dot stale'})}
  function loadZ(){fetch('/api/lev/zvirka',{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){if(j&&j.ok){Z=j;renderZvirka()}}).catch(function(){})}

  document.addEventListener('change',function(e){var t=e.target;if(t.dataset.sfs){SF=t.value;renderSignals()}else if(t.dataset.fs){F=t.value;renderToday()}});
  document.addEventListener('click',function(e){
    if(e.target.id==='shade'){hide();return}
    var el=e.target.closest('[data-tab],[data-sk],[data-filter],[data-g],[data-trade],[data-calm],[data-sigid],[data-close],[data-dec]');if(!el)return;var d=el.dataset;
    if(d.tab){['today','signals','invest','zvirka'].forEach(function(t){$('tab-'+t).classList.toggle('hide',t!==d.tab)});document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b===el)});if(d.tab==='zvirka')loadZ();window.scrollTo(0,0)}
    else if(d.f){F=d.f;renderToday()}
    else if(d.sk){SK=d.sk;SF='all';renderSignals()}
    else if(d.filter){F=d.filter;renderToday();var a=$('trades');if(a)a.scrollIntoView({behavior:'smooth',block:'start'})}
    else if(d.g!=null){OPEN[d.g]=!OPEN[d.g];renderToday()}
    else if(d.calm){openCalm(d.calm)}
    else if(d.trade){openTrade(d.trade)}
    else if(d.sigid){openSignal(d.sigid)}
    else if(d.dec){setDec(d.id,d.dec);openSignal(d.id)}
    else if(d.close){hide()}
  });
  if('serviceWorker' in navigator){navigator.serviceWorker.register('/lev/sw.js',{scope:'/lev/'}).catch(function(){})}
  load();setInterval(load,15000);
})();
</script>
</body>
