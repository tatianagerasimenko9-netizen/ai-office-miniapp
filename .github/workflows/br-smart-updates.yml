name: B&R smart updates isolated tests
on:
  pull_request:
    paths:
      - '.github/workflows/br-smart-updates.yml'
      - 'office_br/idea_matcher.py'
      - 'office_br/universe.py'
      - 'office_br/scheduler.py'
      - 'office_br/notification_policy.py'
      - 'office_br/feed_health.py'
      - 'office_br/telegram_edit.py'
      - 'office_br/live.py'
      - 'office_br/store.py'
      - 'scripts/test_br_smart_updates.py'
      - 'scripts/test_br_universe.py'
      - 'scripts/test_br_scheduler.py'
      - 'scripts/test_br_notification_policy.py'
      - 'scripts/test_br_feed_health.py'
      - 'scripts/test_br_signal_atomic.py'
      - 'scripts/test_br_telegram_edit.py'
  workflow_dispatch: {}
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s scripts -p 'test_br_smart_updates.py'
      - run: python -m unittest discover -s scripts -p 'test_br_universe.py'
      - run: python -m unittest discover -s scripts -p 'test_br_scheduler.py'
      - run: python -m unittest discover -s scripts -p 'test_br_notification_policy.py'
      - run: python -m unittest discover -s scripts -p 'test_br_feed_health.py'
      - run: python -m unittest discover -s scripts -p 'test_br_signal_atomic.py'
      - run: python -m unittest discover -s scripts -p 'test_br_telegram_edit.py'
