name: prod-check (read-only GET)
on:
  push:
    branches: [claude/market-study]
    paths: ['study/prodcheck.trigger']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Production Mini App: стан сценаріїв з deploy #113
        run: python scripts/prod_check.py
