name: extras
on:
  push:
    branches: [claude/eager-pascal-t9e1ac]
    paths:
      - .github/workflows/extras.yml
      - docs/handoff/br-profitability/extras/*.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/eager-pascal-t9e1ac
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas
      - name: Ринкові дані Binance (фандінг, OI, лонг/шорт, taker)
        shell: bash
        run: |
          D=docs/handoff/br-profitability/extras
          python3 $D/fetch_market.py market BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,BNBUSDT,LTCUSDT,DOTUSDT,ATOMUSDT 2022-01-01 2026-11-15
      - name: Дослідження
        shell: bash
        run: |
          D=docs/handoff/br-profitability
          python3 $D/extras/extras.py $D/discover_trades_fee10.csv market | tee $D/extras/extras_out.txt
      - name: Зберегти
        shell: bash
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add docs/handoff/br-profitability/extras/extras_out.txt
          git commit -m "extras: обмеження позицій, ринкові дані, сезонність (автоматично)" && git pull --rebase -X theirs origin claude/eager-pascal-t9e1ac && git push origin HEAD:claude/eager-pascal-t9e1ac
