name: P0 Binance movers shared backoff (offline)

on:
  pull_request:
    paths:
      - 'office2/movers.py'
      - 'office2/dynamic_universe.py'
      - 'office_market_data.py'
      - 'scripts/test_movers_shared_backoff.py'
      - 'scripts/test_futures_movers.py'
      - 'scripts/test_dynamic_universe.py'
      - 'scripts/test_binance_backoff_probe.py'
      - '.github/workflows/movers-shared-backoff.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  offline-backoff:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax
        run: python -m compileall -q office2/movers.py office2/dynamic_universe.py scripts/test_movers_shared_backoff.py
      - name: Shared 418/429 guard
        run: python scripts/test_movers_shared_backoff.py
      - name: Existing Binance probe and retry-after regressions
        run: python scripts/test_binance_backoff_probe.py
      - name: Futures movers eligibility
        run: python scripts/test_futures_movers.py
      - name: Dynamic universe
        run: python scripts/test_dynamic_universe.py
