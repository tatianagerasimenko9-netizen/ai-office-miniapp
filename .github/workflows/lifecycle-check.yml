name: lifecycle-check
on:
  push:
    branches: [claude/lifecycle-check]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/lifecycle_check.py plans.json
