name: asian-sweep
on:
  push:
    branches: [claude/eager-pascal-t9e1ac]
    paths:
      - .github/workflows/asian-sweep.yml
      - docs/handoff/br-profitability/strategy_search/asian_sweep.py
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas
      - name: Fetch M15 2022-01..2026-10 + кейс CBRSUSDT
        run: |
          SYMS=BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,BNBUSDT,LTCUSDT,DOTUSDT,ATOMUSDT
          echo "SYMS=$SYMS" >> $GITHUB_ENV
          python3 scripts/fetch_binance_klines.py candles $SYMS 15m:2022-01-01:2026-11-01 | tail -2
          python3 scripts/fetch_binance_klines.py candles CBRSUSDT 15m:2026-10-15:2026-10-25 | tail -2
      - name: Asian sweep (0.05%) + кейс CBRS 2026-10-19
        run: python3 docs/handoff/br-profitability/strategy_search/asian_sweep.py candles "$SYMS" 0.0005 CBRSUSDT 2026-10-19 | tee asian_out.txt
      - name: Asian sweep (0.10%)
        run: python3 docs/handoff/br-profitability/strategy_search/asian_sweep.py candles "$SYMS" 0.0010 | tee -a asian_out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: asian-sweep
          path: asian_out.txt
