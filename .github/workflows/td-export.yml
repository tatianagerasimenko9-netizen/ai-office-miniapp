name: td-export
on:
  push:
    branches: [claude/eager-pascal-t9e1ac]
    paths:
      - .github/workflows/td-export.yml
      - scripts/td_export_model.py
      - office_td/model.py
      - office_td/features.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/eager-pascal-t9e1ac
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas scikit-learn
      - name: Fetch M15 2022-01..2026-10
        shell: bash
        run: |
          SYMS=BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,BNBUSDT,LTCUSDT,DOTUSDT,ATOMUSDT
          echo "SYMS=$SYMS" >> $GITHUB_ENV
          python3 scripts/fetch_binance_klines.py candles $SYMS 15m:2022-01-01:2026-11-01 | tail -2
          test -s candles/BTCUSDT/15m.csv || { echo 'FETCH FAILED'; exit 1; }
      - name: Train + export model (cost 0.10%)
        shell: bash
        run: python3 scripts/td_export_model.py candles "$SYMS" 0.0010 office_td/model_v1.json | tee td_export_out.txt
      - name: Commit model
        shell: bash
        run: |
          git config user.name "claude-code-bot"; git config user.email "noreply@anthropic.com"
          git add office_td/model_v1.json
          git commit -m "TD-V1: експорт моделі (навчання 2022-2023, поріг з 2024) з GitHub Actions" || echo "нічого комітити"
          git pull --rebase origin claude/eager-pascal-t9e1ac && git push origin HEAD:claude/eager-pascal-t9e1ac
      - uses: actions/upload-artifact@v4
        with:
          name: td-export
          path: td_export_out.txt
