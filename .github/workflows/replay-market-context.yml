name: replay-market-context
# Дослідження ринкового контексту READY (сесія / BTC / відносна сила / одночасні сигнали) на ГОТОВИХ артефактах повного replay — без повторного replay.
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'run-id повного replay-tactics з артефактами replay-<ПЕРІОД>-<СИМВОЛ>'
        required: true
        default: '38438248492'
permissions:
  contents: read
  actions: read
jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: replay-*
          path: parts
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
      - name: Market context study
        run: |
          set -o pipefail
          python -u scripts/replay_market_context_study.py parts replay_market_context.json | tee "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: replay-market-context
          path: replay_market_context.json
