name: swcomm
on:
  push:
    branches: [claude/eager-pascal-t9e1ac]
    paths:
      - .github/workflows/swcomm.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/eager-pascal-t9e1ac
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas scikit-learn numba
      - name: Fetch M15 (метали, нафта, газ, акції)
        shell: bash
        run: |
          SYMS=XAUUSDT,XAGUSDT,CLUSDT,BZUSDT,NATGASUSDT,NVDAUSDT,SPCXUSDT
          echo "SYMS=$SYMS" >> $GITHUB_ENV
          for S in ${SYMS//,/ }; do python3 scripts/fetch_binance_klines.py candles $S 15m:2022-01-01:2026-11-16 | tr '\n' ' '; echo; done
          ls candles
      - name: СВІНГ (3 рукави H4) на нових інструментах
        shell: bash
        run: |
          export ONLY="H4|donchian20+MA200|fix s3 TP6;H4|RSI2 reversion+MA200|fix s3 TP6;H4|Bollinger reversion+MA200|fix s3 TP6"
          D=docs/handoff/br-profitability
          for F in 0.001 0.0005; do
            echo "=== fee $F ===" | tee -a $D/swcomm_out.txt
            DETAIL=$D/swcomm_trades_$F.csv python3 $D/strategy_search/discover.py candles "$SYMS" $F | tee -a $D/swcomm_out.txt
          done
          rm -f discover_results.csv
      - name: Зберегти
        shell: bash
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add docs/handoff/br-profitability/swcomm_*
          git commit -m "swcomm: СВІНГ на металах/нафті/газі/акціях (автоматично)" && git pull --rebase -X theirs origin claude/eager-pascal-t9e1ac && git push origin HEAD:claude/eager-pascal-t9e1ac
