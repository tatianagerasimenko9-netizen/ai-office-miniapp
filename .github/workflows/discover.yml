name: discover
on:
  push:
    branches: [claude/eager-pascal-t9e1ac]
    paths:
      - .github/workflows/discover.yml
      - docs/handoff/br-profitability/strategy_search/discover.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/eager-pascal-t9e1ac
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas numba
      - name: Fetch M15 2022-2026 (12 монет)
        shell: bash
        run: |
          TRAIN=BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,BNBUSDT,LTCUSDT,DOTUSDT,ATOMUSDT
          echo "TRAIN=$TRAIN" >> $GITHUB_ENV
          for S in ${TRAIN//,/ }; do python3 scripts/fetch_binance_klines.py candles $S 15m:2022-01-01:2026-11-14 | tr '\n' ' '; echo; done
          test -s candles/BTCUSDT/15m.csv || { echo 'FETCH FAILED'; exit 1; }
      - name: Пошук стратегій (комісія 0.10% і 0.06%)
        shell: bash
        run: |
          python3 docs/handoff/br-profitability/strategy_search/discover.py candles "$TRAIN" 0.001 | tee docs/handoff/br-profitability/discover_out.txt
          mv discover_results.csv docs/handoff/br-profitability/discover_results_fee10.csv
          echo "=================== КОМІСІЯ 0.06% (вхід і ціль лімітами) ===================" | tee -a docs/handoff/br-profitability/discover_out.txt
          python3 docs/handoff/br-profitability/strategy_search/discover.py candles "$TRAIN" 0.0006 | tee -a docs/handoff/br-profitability/discover_out.txt
          mv discover_results.csv docs/handoff/br-profitability/discover_results_fee06.csv
      - name: Деталі кращих конфігурацій (за монетами, напрямком, просідання)
        shell: bash
        run: |
          ONLY="H4|donchian20+MA200|fix s3 TP6;H4|RSI2 reversion+MA200|fix s3 TP6;H4|donchian20|trail 3 ATR;H4|Bollinger reversion+MA200|fix s3 TP6;H4|donchian100+MA200|fix s1.5 TP2;D1|donchian20|fix s1.5 TP2;H4|Bollinger breakout|fix s3 TP6;H4|RSI14 >70/<30 momentum|fix s3 TP6" DETAIL=docs/handoff/br-profitability/discover_trades_fee10.csv python3 docs/handoff/br-profitability/strategy_search/discover.py candles "$TRAIN" 0.001 > /dev/null
          rm -f discover_results.csv
      - name: Зберегти
        shell: bash
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add docs/handoff/br-profitability/discover_trades_fee10.csv docs/handoff/br-profitability/discover_out.txt docs/handoff/br-profitability/discover_results_fee10.csv docs/handoff/br-profitability/discover_results_fee06.csv
          git commit -m "discover: широкий пошук класичних стратегій (автоматично)" && git pull --rebase -X theirs origin claude/eager-pascal-t9e1ac && git push origin HEAD:claude/eager-pascal-t9e1ac
