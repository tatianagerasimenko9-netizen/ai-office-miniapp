name: replay-probe
on:
  push:
    branches: [claude/replay-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe public market data sources (read-only)
        run: |
          for u in \
            "https://data.binance.vision/data/futures/um/daily/klines/BTCUSDT/15m/BTCUSDT-15m-2026-10-02.zip" \
            "https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=15m&limit=2" \
            "https://api.bybit.com/v5/market/kline?category=linear&symbol=BTCUSDT&interval=15&limit=2" \
            "https://www.okx.com/api/v5/market/history-candles?instId=BTC-USDT-SWAP&bar=15m&limit=2" \
            "https://api.gateio.ws/api/v4/futures/usdt/candlesticks?contract=BTC_USDT&interval=15m&limit=2"; do
            echo "$u -> $(curl -s -m 15 -o /dev/null -w '%{http_code}' "$u")"
          done
