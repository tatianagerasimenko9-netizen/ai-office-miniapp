name: B&R live observational safety
on:
  pull_request:
    paths:
      - 'office_br/**'
      - 'office_relay_wizard.py'
      - 'scripts/test_br_live.py'
      - 'scripts/test_br_live_delivery_order.py'
      - 'scripts/test_br_analyst_evidence.py'
      - '.github/workflows/br-live-safety.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile only
        run: python -m py_compile office_br/live.py office_br/card.py office_br/analyst_evidence.py office_relay_wizard.py scripts/test_br_live.py scripts/test_br_live_delivery_order.py scripts/test_br_analyst_evidence.py
      - name: Offline safety checks
        run: python scripts/test_br_live.py && python scripts/test_br_live_delivery_order.py && python scripts/test_br_analyst_evidence.py
