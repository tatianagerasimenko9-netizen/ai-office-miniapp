name: commodities
on:
  push:
    branches: [claude/eager-pascal-t9e1ac]
    paths:
      - .github/workflows/commodities.yml
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/eager-pascal-t9e1ac
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas scikit-learn
      - name: Fetch (12 навчальних + золото/срібло/нафта/газ)
        shell: bash
        run: |
          TRAIN=BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,BNBUSDT,LTCUSDT,DOTUSDT,ATOMUSDT
          NEW=XAUUSDT,XAGUSDT,CLUSDT,BZUSDT,NATGASUSDT
          echo "TRAIN=$TRAIN" >> $GITHUB_ENV; echo "NEW=$NEW" >> $GITHUB_ENV
          for S in ${TRAIN//,/ } ${NEW//,/ }; do
            python3 scripts/fetch_binance_klines.py candles $S 15m:2022-01-01:2026-11-01 | tr '\n' ' '; echo
          done
          test -s candles/BTCUSDT/15m.csv || { echo 'FETCH FAILED'; exit 1; }
          for S in ${NEW//,/ }; do
            python3 - "$S" <<'PY'
          import sys, os, pandas as pd
          s = sys.argv[1]; p = f"candles/{s}/15m.csv"
          if not os.path.exists(p) or os.path.getsize(p) == 0: print(s, "НЕМАЄ ДАНИХ"); sys.exit()
          d = pd.read_csv(p); print(s, "барів M15:", len(d), "від", pd.to_datetime(d.open_time.min(), unit="s"), "до", pd.to_datetime(d.open_time.max(), unit="s"))
          PY
          done
      - name: Сировина (0.10%)
        shell: bash
        run: cd docs/handoff/br-profitability/strategy_search && python3 newcoins.py ../../../../candles "$TRAIN" "$NEW" 0.0010 | tee ../../../../c_out.txt
      - name: Сировина (0.05%)
        shell: bash
        run: cd docs/handoff/br-profitability/strategy_search && python3 newcoins.py ../../../../candles "$TRAIN" "$NEW" 0.0005 | tee -a ../../../../c_out.txt
