name: Replay B&R TEST (isolated, read-only)

# run-id: br-2 (змінюйте число, щоб свідомо повторити прогін)
# B&R · TEST (пробій → ретест → відбій) на реальних свічках Binance Futures M15, періоди A–G, 12 символів. Пороги — ГІПОТЕЗИ. Працює лише в GitHub Actions; нічого не пише в БД/Render/Telegram.
on:
  push:
    branches: ['feat/br-test-20261014']
    paths: ['.github/workflows/replay-br-test.yml']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [V1, V2]
        symbol: [BTCUSDT, ETHUSDT, SOLUSDT, XRPUSDT, DOGEUSDT, ADAUSDT, AVAXUSDT, LINKUSDT, NEARUSDT, TIAUSDT, SEIUSDT, ONDOUSDT]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      BR_MIN_RISK_PCT: ${{ matrix.variant == 'V2' && '0.005' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy tzdata
      - run: python -u scripts/br_replay.py "${{ matrix.symbol }}" "br_${{ matrix.symbol }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: br-${{ matrix.variant }}-${{ matrix.symbol }}
          path: br_${{ matrix.symbol }}.json
  study:
    needs: replay
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: br-V1-*
          path: parts_v1
      - uses: actions/download-artifact@v4
        with:
          pattern: br-V2-*
          path: parts_v2
      - run: |
          echo "## V1 (min_risk_atr 0,3; без фільтра за % стопа)" | tee -a "$GITHUB_STEP_SUMMARY"
          python -u scripts/br_study.py parts_v1 br_study_v1.json | tee -a "$GITHUB_STEP_SUMMARY"
          echo "## V2 (додатково стоп ≥ 0,5% від входу — ГІПОТЕЗА)" | tee -a "$GITHUB_STEP_SUMMARY"
          python -u scripts/br_study.py parts_v2 br_study_v2.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: br-study
          path: br_study_v*.json
