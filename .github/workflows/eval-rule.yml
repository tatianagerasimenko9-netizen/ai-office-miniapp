name: eval-rule
on:
  push:
    branches: [claude/eager-pascal-t9e1ac]
    paths:
      - .github/workflows/eval-rule.yml
      - docs/handoff/br-profitability/strategy_search/eval_rule.py
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas scikit-learn
      - name: Fetch OLDER M15 (2024-01..2025-10, дерево цього періоду не бачило)
        run: |
          SYMS=BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,BNBUSDT,LTCUSDT,DOTUSDT,ATOMUSDT
          echo "SYMS=$SYMS" >> $GITHUB_ENV
          python3 scripts/fetch_binance_klines.py candles $SYMS 15m:2024-01-01:2025-10-31 | tail -2
      - name: Eval (комісія 0.05%)
        run: cd docs/handoff/br-profitability/strategy_search && python3 eval_rule.py ../../../../candles "$SYMS" 0.0005 | tee ../../../../eval_out.txt
      - name: Eval (комісія 0.10%)
        run: cd docs/handoff/br-profitability/strategy_search && python3 eval_rule.py ../../../../candles "$SYMS" 0.0010 | tee -a ../../../../eval_out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: eval-rule
          path: eval_out.txt
