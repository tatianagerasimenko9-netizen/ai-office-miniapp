name: topdown
on:
  push:
    branches: [claude/eager-pascal-t9e1ac]
    paths:
      - .github/workflows/topdown.yml
      - docs/handoff/br-profitability/strategy_search/topdown.py
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas scikit-learn
      - name: Fetch M15 2022-01..2026-10
        run: |
          SYMS=BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,BNBUSDT,LTCUSDT,DOTUSDT,ATOMUSDT
          echo "SYMS=$SYMS" >> $GITHUB_ENV
          python3 scripts/fetch_binance_klines.py candles $SYMS 15m:2022-01-01:2026-11-01 | tail -2
      - name: Top-down, модель рівнів (0.10%)
        run: cd docs/handoff/br-profitability/strategy_search && MODEL=ml_discover2 python3 topdown.py ../../../../candles "$SYMS" 0.0010 | tee ../../../../td_out.txt
      - name: Top-down, повний інструментарій (0.10%)
        run: cd docs/handoff/br-profitability/strategy_search && MODEL=ml_discover3 python3 topdown.py ../../../../candles "$SYMS" 0.0010 | tee -a ../../../../td_out.txt
      - name: Top-down, модель рівнів (0.05%)
        run: cd docs/handoff/br-profitability/strategy_search && MODEL=ml_discover2 python3 topdown.py ../../../../candles "$SYMS" 0.0005 | tee -a ../../../../td_out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: topdown
          path: td_out.txt
