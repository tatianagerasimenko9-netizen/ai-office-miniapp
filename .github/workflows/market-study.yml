name: market-study (read-only)
on:
  push:
    branches: [claude/market-study]
permissions:
  contents: read
jobs:
  phase:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy
      - name: Фаза руху на ~60 монетах × 6 міс.
        run: python -u scripts/phase_study.py 2>&1 | tee phase_out.txt
      - uses: actions/upload-artifact@v4
        with: {name: phase-study, path: phase_out.txt}
