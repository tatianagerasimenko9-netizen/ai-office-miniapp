name: market-study (read-only)
on:
  push:
    branches: [claude/market-study]
permissions:
  contents: read
jobs:
  prodcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Production Mini App після deploy #113 (лише GET)
        run: python scripts/prod_check.py
