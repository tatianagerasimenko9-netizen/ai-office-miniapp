name: market-study (read-only)
on:
  push:
    branches: [claude/market-study]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Які історичні дані є безкоштовно
        run: python scripts/probe_vision.py
