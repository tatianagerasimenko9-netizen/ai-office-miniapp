name: liveflags
on:
  push:
    branches: [claude/eager-pascal-t9e1ac]
    paths:
      - .github/workflows/liveflags.yml
      - docs/handoff/br-profitability/strategy_search/live_flags.py
      - docs/handoff/br-profitability/strategy_search/live_warn.py
      - office_td/warn.py
      - docs/handoff/br-profitability/live_signals.csv
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/eager-pascal-t9e1ac
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas
      - name: Fetch M15
        shell: bash
        run: |
          for S in BTCUSDT ETHUSDT SOLUSDT XRPUSDT DOGEUSDT ADAUSDT AVAXUSDT LINKUSDT BNBUSDT LTCUSDT DOTUSDT ATOMUSDT XAUUSDT XAGUSDT CLUSDT BZUSDT NATGASUSDT NVDAUSDT SPCXUSDT; do
            python3 scripts/fetch_binance_klines.py candles $S 15m:2026-08-20:2026-11-14 | tr '\n' ' '; echo
          done
      - name: Живий код попередження на сигналах 1-86
        shell: bash
        run: python3 docs/handoff/br-profitability/strategy_search/live_warn.py candles docs/handoff/br-profitability/live_signals.csv . | tee docs/handoff/br-profitability/live_flags_out.txt
      - name: Зберегти
        shell: bash
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add docs/handoff/br-profitability/live_flags_out.txt
          git commit -m "liveflags: попередження на живих сигналах (автоматично)" && git pull --rebase -X theirs origin claude/eager-pascal-t9e1ac && git push origin HEAD:claude/eager-pascal-t9e1ac
