name: spotlab
on:
  push:
    branches: [claude/eager-pascal-t9e1ac]
    paths:
      - .github/workflows/spotlab.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/eager-pascal-t9e1ac
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas
      - name: Увесь спот Binance (денні свічки, включно зі знятими з торгів)
        shell: bash
        run: |
          python3 docs/handoff/br-profitability/strategy_search/spot_lab.py fetchspot dly BTCUSDT,ETHUSDT
          ls dly | wc -l
      - name: Спот-лабораторія
        shell: bash
        run: |
          D=docs/handoff/br-profitability
          python3 $D/strategy_search/spot_lab.py run dly ALL | tee $D/spotlab_out.txt
          test $(ls dly | wc -l) -gt 150 || { echo 'замало монет — перелік не завантажився'; exit 1; }
      - name: Зберегти
        shell: bash
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add docs/handoff/br-profitability/spotlab_out.txt
          git commit -m "spotlab: спот-лабораторія (автоматично)"
          for i in 1 2 3; do git pull --rebase -X theirs origin claude/eager-pascal-t9e1ac && git push origin HEAD:claude/eager-pascal-t9e1ac && break; sleep 5; done
