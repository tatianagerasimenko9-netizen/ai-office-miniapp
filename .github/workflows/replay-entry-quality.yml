name: Replay entry quality (isolated, read-only)

# run-id: eq-1 (змінюйте це число, щоб свідомо повторити прогін на гілці)
# Replay Brain v2.1: якість входу і стопа (рекавері до початкового TP1 після SL, причини SL, альтернативи входу/SL) на закритих барах Binance Futures; зведення scripts/entry_quality_study.py. Працює в GitHub Actions, не в production. Нічого не пише в БД/Render/Telegram.
on:
  push:
    branches: ['claude/eager-pascal-t9e1ac']
    paths: ['.github/workflows/replay-entry-quality.yml']      # повторний прогін лише свідомою зміною цього файлу (скрипти аналізу запуск не викликають)
  workflow_dispatch:
    inputs:
      subset:
        description: 'full = 29 символів × 7 періодів; major12 = 12 символів × 7 періодів (повторний прогін після змін коду)'
        default: 'full'

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          full = "BTCUSDT ETHUSDT BNBUSDT SOLUSDT XRPUSDT DOGEUSDT ADAUSDT AVAXUSDT LINKUSDT DOTUSDT LTCUSDT NEARUSDT OPUSDT SUIUSDT UNIUSDT ETCUSDT FILUSDT HBARUSDT TIAUSDT SEIUSDT 1000PEPEUSDT 1000SHIBUSDT FETUSDT RUNEUSDT ALGOUSDT MKRUSDT WLDUSDT ONDOUSDT JUPUSDT".split()
          major = "BTCUSDT ETHUSDT SOLUSDT XRPUSDT DOGEUSDT ADAUSDT AVAXUSDT LINKUSDT NEARUSDT TIAUSDT SEIUSDT ONDOUSDT".split()
          sym = major if os.environ["SUBSET"] == "major12" else full
          print("matrix=" + json.dumps({"period": list("ABCDEFG"), "symbol": sym}))
          PY
        env:
          SUBSET: ${{ inputs.subset || 'major12' }}
  replay:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OFFICE_EXINFO_SEED: '1'
      REPLAY_LTF: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy tzdata
      - name: Replay ${{ matrix.period }} ${{ matrix.symbol }}
        run: |
          case "${{ matrix.period }}" in
            A) E=2026-09-25; D=14;;
            B) E=2026-10-09; D=14;;
            C) E=2026-10-11; D=2;;
            D) E=2026-08-28; D=14;;
            E) E=2026-08-14; D=14;;
            F) E=2026-07-31; D=14;;
            G) E=2026-07-17; D=14;;
          esac
          python -u scripts/learning_binance_replay.py "${{ matrix.symbol }}" "$E" "$D" "out_${{ matrix.symbol }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: eq-${{ matrix.period }}-${{ matrix.symbol }}
          path: out_${{ matrix.symbol }}.json
  pooled:
    needs: replay
    if: always()
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy tzdata
      - uses: actions/download-artifact@v4
        with:
          pattern: eq-A-*
          path: parts
      - uses: actions/download-artifact@v4
        with:
          pattern: eq-B-*
          path: parts
      - uses: actions/download-artifact@v4
        with:
          pattern: eq-C-*
          path: parts
      - uses: actions/download-artifact@v4
        with:
          pattern: eq-D-*
          path: parts
      - uses: actions/download-artifact@v4
        with:
          pattern: eq-E-*
          path: parts
      - uses: actions/download-artifact@v4
        with:
          pattern: eq-F-*
          path: parts
      - uses: actions/download-artifact@v4
        with:
          pattern: eq-G-*
          path: parts
      - name: Entry quality study A–G
        run: |
          set -o pipefail
          python -u scripts/entry_quality_study.py parts entry_quality.json | tee "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: entry-quality-all
          path: entry_quality.json
