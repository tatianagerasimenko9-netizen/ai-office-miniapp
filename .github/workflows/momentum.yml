name: momentum
on:
  push:
    branches: [claude/eager-pascal-t9e1ac]
    paths:
      - .github/workflows/momentum.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    strategy:
      fail-fast: false
      matrix:
        part: [holdout2020_2021, insample2022_2026]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/eager-pascal-t9e1ac
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas
      - name: Fetch M15
        shell: bash
        run: |
          if [ "${{ matrix.part }}" = "holdout2020_2021" ]; then
            ALLC=BTCUSDT,ETHUSDT,BNBUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,LINKUSDT,LTCUSDT,DOTUSDT,ATOMUSDT,TRXUSDT,ETCUSDT,BCHUSDT,EOSUSDT,XLMUSDT,VETUSDT,ALGOUSDT,FILUSDT,AAVEUSDT,UNIUSDT,SANDUSDT,MANAUSDT,AXSUSDT,GRTUSDT,HBARUSDT,THETAUSDT,SOLUSDT,AVAXUSDT,NEARUSDT,MKRUSDT,CRVUSDT,SNXUSDT,RUNEUSDT,ICPUSDT
            RNG=15m:2020-01-01:2021-12-31
          else
            ALLC=BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,BNBUSDT,LTCUSDT,DOTUSDT,ATOMUSDT,TRXUSDT,NEARUSDT,OPUSDT,FILUSDT,ETCUSDT,UNIUSDT,AAVEUSDT,MKRUSDT,SANDUSDT,MANAUSDT,AXSUSDT,GALAUSDT,RUNEUSDT,LDOUSDT,CRVUSDT,SNXUSDT,ICPUSDT,XLMUSDT,BCHUSDT,ALGOUSDT,VETUSDT,GRTUSDT,APEUSDT,IMXUSDT,INJUSDT,APTUSDT,EOSUSDT,HBARUSDT,THETAUSDT,DYDXUSDT
            RNG=15m:2022-01-01:2026-11-21
          fi
          echo "ALL=$ALLC" >> $GITHUB_ENV
          for S in ${ALLC//,/ }; do python3 scripts/fetch_binance_klines.py candles $S $RNG | tr '\n' ' '; echo; done
      - name: Тест імпульсу (LONG після росту)
        shell: bash
        run: |
          D=docs/handoff/br-profitability
          MOM=1 python3 $D/strategy_search/dip_test.py candles "$ALL" 0.001 $D/mom_${{ matrix.part }} | tee $D/mom_${{ matrix.part }}_out.txt
      - name: Зберегти
        shell: bash
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add docs/handoff/br-profitability/mom_*
          git commit -m "momentum: ${{ matrix.part }} (автоматично)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin claude/eager-pascal-t9e1ac && git push origin HEAD:claude/eager-pascal-t9e1ac && break; sleep $((RANDOM%20+5)); done
