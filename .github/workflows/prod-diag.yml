name: Production diag (read-only)

# Разова діагностика: показує сирі відповіді публічних GET-ендпоінтів Mini App. Нічого не змінює.
on:
  workflow_dispatch: {}
  push:
    branches: ['claude/eager-pascal-t9e1ac']
    paths: ['.github/workflows/prod-diag.yml']

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET candles / summary
        run: |
          B=https://ai-office-miniapp.onrender.com
          for u in "/api/v2/candles?symbol=BTCUSDT&tf=M15&limit=30" "/api/v2/candles?symbol=ETHUSDT&tf=H1&limit=30" "/api/v2/candles?symbol=BTCUSDT&tf=M15&limit=30"; do
            echo "== $u"; curl -sS --max-time 40 "$B$u" | head -c 1200; echo
          done
          echo "== summary (source health)"; curl -sS --max-time 40 "$B/api/summary" | python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps({k:d.get(k) for k in ('source_health','data_health','binance','db_identity','git_sha')}, ensure_ascii=False)[:1500]); print(sorted(d.keys())[:60])"
