name: bemanage
on:
  push:
    branches: [claude/eager-pascal-t9e1ac]
    paths:
      - .github/workflows/bemanage.yml
      - docs/handoff/br-profitability/strategy_search/bemanage.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/eager-pascal-t9e1ac
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas scikit-learn numba
      - name: Fetch M15
        shell: bash
        run: |
          TRAIN=BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,BNBUSDT,LTCUSDT,DOTUSDT,ATOMUSDT
          NEW=TRXUSDT,NEARUSDT,OPUSDT,FILUSDT,ETCUSDT,UNIUSDT,AAVEUSDT,MKRUSDT,SANDUSDT,MANAUSDT,AXSUSDT,GALAUSDT,RUNEUSDT,LDOUSDT,CRVUSDT,SNXUSDT,ICPUSDT,XLMUSDT,BCHUSDT,ALGOUSDT,VETUSDT,GRTUSDT,APEUSDT,IMXUSDT,INJUSDT,APTUSDT,EOSUSDT,HBARUSDT,THETAUSDT,DYDXUSDT
          echo "TRAIN=$TRAIN" >> $GITHUB_ENV; echo "NEW=$NEW" >> $GITHUB_ENV
          for S in ${TRAIN//,/ } ${NEW//,/ }; do python3 scripts/fetch_binance_klines.py candles $S 15m:2022-01-01:2026-11-16 | tr '\n' ' '; echo; done
          test -s candles/BTCUSDT/15m.csv || { echo 'FETCH FAILED'; exit 1; }
      - name: ІНТРАДЕЙ - беззбиток і трейлінг
        shell: bash
        run: |
          D=docs/handoff/br-profitability
          cd $D/strategy_search
          python3 bemanage.py ../../../../candles "$TRAIN" 0.0010 | tee ../bemanage_td_out.txt
          python3 bemanage.py ../../../../candles "$TRAIN" 0.0005 | tee -a ../bemanage_td_out.txt
      - name: СВІНГ - беззбиток і трейлінг
        shell: bash
        run: |
          D=docs/handoff/br-profitability
          export ONLY=""
          for X in "fix s3 TP6" "BE +1R TP6" "BE +1.5R TP6" "BE +2R TP6" "BE +3R TP6" "trail1R після +1.5R TP6" "trail1R після +2R TP6" "trail1R після +3R TP6" "trail0.5R після +2R TP6" "trail0.5R після +3R TP6"; do
            for SG in "donchian20+MA200" "RSI2 reversion+MA200" "Bollinger reversion+MA200"; do ONLY="$ONLY;H4|$SG|$X"; done
          done
          export ONLY="${ONLY#;}"
          DETAIL=$D/bemanage_sw_base_trades.csv python3 $D/strategy_search/discover.py candles "$TRAIN" 0.001 > $D/bemanage_sw_base_out.txt
          DETAIL=$D/bemanage_sw_new_trades.csv python3 $D/strategy_search/discover.py candles "$NEW" 0.001 > $D/bemanage_sw_new_out.txt
          rm -f discover_results.csv
      - name: Зберегти
        shell: bash
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add docs/handoff/br-profitability/bemanage_*
          git commit -m "bemanage: беззбиток і трейлінг для ІНТРАДЕЙ і СВІНГ (автоматично)" && git pull --rebase -X theirs origin claude/eager-pascal-t9e1ac && git push origin HEAD:claude/eager-pascal-t9e1ac
