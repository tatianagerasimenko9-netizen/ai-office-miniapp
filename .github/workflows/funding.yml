name: funding
on:
  push:
    branches: [claude/eager-pascal-t9e1ac]
    paths:
      - .github/workflows/funding.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/eager-pascal-t9e1ac
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas
      - name: Фандинг з архіву Binance
        shell: bash
        run: |
          ALLC=BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,BNBUSDT,LTCUSDT,DOTUSDT,ATOMUSDT,TRXUSDT,NEARUSDT,OPUSDT,FILUSDT,ETCUSDT,UNIUSDT,AAVEUSDT,MKRUSDT,SANDUSDT,MANAUSDT,AXSUSDT,GALAUSDT,RUNEUSDT,LDOUSDT,CRVUSDT,SNXUSDT,ICPUSDT,XLMUSDT,BCHUSDT,ALGOUSDT,VETUSDT,GRTUSDT,APEUSDT,IMXUSDT,INJUSDT,APTUSDT,EOSUSDT,HBARUSDT,THETAUSDT,DYDXUSDT
          echo "ALL=$ALLC" >> $GITHUB_ENV
          python3 docs/handoff/br-profitability/strategy_search/funding_carry.py fetch fund "$ALLC"
          ls fund | wc -l
      - name: Фандинг-перенос
        shell: bash
        run: |
          D=docs/handoff/br-profitability
          python3 $D/strategy_search/funding_carry.py run fund "$ALL" $D/funding | tee $D/funding_out.txt
      - name: Зберегти
        shell: bash
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          mkdir -p docs/handoff/br-profitability/data/funding && cp fund/*.csv docs/handoff/br-profitability/data/funding/ 2>/dev/null || true
          git add docs/handoff/br-profitability/funding_out.txt docs/handoff/br-profitability/data/funding
          git commit -m "funding: фандинг-перенос (автоматично)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin claude/eager-pascal-t9e1ac && git push origin HEAD:claude/eager-pascal-t9e1ac && break; sleep $((RANDOM%20+5)); done
