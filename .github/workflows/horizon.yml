name: horizon
on:
  push:
    branches: [claude/eager-pascal-t9e1ac]
    paths:
      - .github/workflows/horizon.yml
      - docs/handoff/br-profitability/strategy_search/horizon.py
      - docs/handoff/br-profitability/strategy_search/live_timeouts.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/eager-pascal-t9e1ac
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas scikit-learn
      - name: Fetch M15
        shell: bash
        run: |
          TRAIN=BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,BNBUSDT,LTCUSDT,DOTUSDT,ATOMUSDT
          echo "TRAIN=$TRAIN" >> $GITHUB_ENV
          for S in ${TRAIN//,/ }; do
            python3 scripts/fetch_binance_klines.py candles $S 15m:2022-01-01:2026-11-14 | tr '\n' ' '; echo
          done
          for S in NATGASUSDT XAGUSDT; do python3 scripts/fetch_binance_klines.py live $S 15m:2026-11-01:2026-11-14 | tr '\n' ' '; echo; done
          for S in XRPUSDT ATOMUSDT BNBUSDT; do python3 scripts/fetch_binance_klines.py live $S 15m:2026-11-01:2026-11-14 | tr '\n' ' '; echo; done
          test -s candles/BTCUSDT/15m.csv || { echo 'FETCH FAILED'; exit 1; }
      - name: Живі угоди «за часом»
        shell: bash
        run: |
          cd docs/handoff/br-profitability/strategy_search
          python3 live_timeouts.py ../../../../live | tee ../horizon_out.txt
      - name: Історія — довший час тримання
        shell: bash
        run: |
          cd docs/handoff/br-profitability/strategy_search
          python3 horizon.py ../../../../candles "$TRAIN" 0.0010 | tee -a ../horizon_out.txt
          python3 horizon.py ../../../../candles "$TRAIN" 0.0005 | tee -a ../horizon_out.txt
      - name: Зберегти результат у гілку
        shell: bash
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add docs/handoff/br-profitability/horizon_out.txt
          git commit -m "horizon: що з угодами за часом і чи тримати довше (автоматично)" && git pull --rebase origin claude/eager-pascal-t9e1ac && git push origin HEAD:claude/eager-pascal-t9e1ac
