name: universe
on:
  push:
    branches: [claude/eager-pascal-t9e1ac]
    paths:
      - .github/workflows/universe.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/eager-pascal-t9e1ac
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas scikit-learn numba
      - name: Fetch M15 2022-2026 (12 базових + 30 нових монет)
        shell: bash
        run: |
          TRAIN=BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,BNBUSDT,LTCUSDT,DOTUSDT,ATOMUSDT
          NEW=TRXUSDT,NEARUSDT,OPUSDT,FILUSDT,ETCUSDT,UNIUSDT,AAVEUSDT,MKRUSDT,SANDUSDT,MANAUSDT,AXSUSDT,GALAUSDT,RUNEUSDT,LDOUSDT,CRVUSDT,SNXUSDT,ICPUSDT,XLMUSDT,BCHUSDT,ALGOUSDT,VETUSDT,GRTUSDT,APEUSDT,IMXUSDT,INJUSDT,APTUSDT,EOSUSDT,HBARUSDT,THETAUSDT,DYDXUSDT
          echo "TRAIN=$TRAIN" >> $GITHUB_ENV; echo "NEW=$NEW" >> $GITHUB_ENV
          for S in ${TRAIN//,/ } ${NEW//,/ }; do python3 scripts/fetch_binance_klines.py candles $S 15m:2022-01-01:2026-11-14 | tr '\n' ' '; echo; done
          test -s candles/BTCUSDT/15m.csv || { echo 'FETCH FAILED'; exit 1; }
      - name: СВІНГ на базових і нових монетах (3 рукави H4)
        shell: bash
        run: |
          export ONLY="H4|donchian20+MA200|fix s3 TP6;H4|RSI2 reversion+MA200|fix s3 TP6;H4|Bollinger reversion+MA200|fix s3 TP6"
          DETAIL=docs/handoff/br-profitability/universe_swing_base_trades.csv python3 docs/handoff/br-profitability/strategy_search/discover.py candles "$TRAIN" 0.001 > docs/handoff/br-profitability/universe_swing_base_out.txt
          DETAIL=docs/handoff/br-profitability/universe_swing_new_trades.csv python3 docs/handoff/br-profitability/strategy_search/discover.py candles "$NEW" 0.001 > docs/handoff/br-profitability/universe_swing_new_out.txt
          rm -f discover_results.csv
      - name: ІНТРАДЕЙ (TD): модель навчена на 12 монетах — чи працює на нових
        shell: bash
        run: |
          cd docs/handoff/br-profitability/strategy_search
          python3 newcoins.py ../../../../candles "$TRAIN" "$NEW" 0.0010 | tee ../universe_td_out.txt
          python3 newcoins.py ../../../../candles "$TRAIN" "$NEW" 0.0005 | tee -a ../universe_td_out.txt
      - name: Зберегти
        shell: bash
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add docs/handoff/br-profitability/universe_*
          git commit -m "universe: розширення списку монет — СВІНГ і ІНТРАДЕЙ (автоматично)" && git pull --rebase -X theirs origin claude/eager-pascal-t9e1ac && git push origin HEAD:claude/eager-pascal-t9e1ac
