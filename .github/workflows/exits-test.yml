name: exits-test
on:
  push:
    branches: [claude/eager-pascal-t9e1ac]
    paths:
      - .github/workflows/exits-test.yml
      - docs/handoff/br-profitability/strategy_search/exits_test.py
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas scikit-learn
      - name: Fetch M15 2024-01..2026-10
        run: |
          SYMS=BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,BNBUSDT,LTCUSDT,DOTUSDT,ATOMUSDT
          echo "SYMS=$SYMS" >> $GITHUB_ENV
          python3 scripts/fetch_binance_klines.py candles $SYMS 15m:2024-01-01:2026-11-01 | tail -2
      - name: Exits (0.05%)
        run: cd docs/handoff/br-profitability/strategy_search && python3 exits_test.py ../../../../candles "$SYMS" 0.0005 | tee ../../../../exits_out.txt
      - name: Exits (0.10%)
        run: cd docs/handoff/br-profitability/strategy_search && python3 exits_test.py ../../../../candles "$SYMS" 0.0010 | tee -a ../../../../exits_out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: exits-test
          path: exits_out.txt
