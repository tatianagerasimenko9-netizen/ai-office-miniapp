name: walkforward
on:
  push:
    branches: [claude/eager-pascal-t9e1ac]
    paths:
      - .github/workflows/walkforward.yml
      - docs/handoff/br-profitability/strategy_search/walkforward.py
      - docs/handoff/br-profitability/strategy_search/toolkit.py
      - docs/handoff/br-profitability/strategy_search/leakcheck.py
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas scikit-learn
      - name: Fetch M15 2022-01..2026-10
        shell: bash
        run: |
          SYMS=BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,BNBUSDT,LTCUSDT,DOTUSDT,ATOMUSDT
          echo "SYMS=$SYMS" >> $GITHUB_ENV
          python3 scripts/fetch_binance_klines.py candles $SYMS 15m:2022-01-01:2026-11-01 | tail -2
          test -s candles/BTCUSDT/15m.csv || { echo 'FETCH FAILED: немає BTCUSDT/15m.csv'; exit 1; }
      - name: LEAKCHECK (підгляд у майбутнє, реальні дані)
        shell: bash
        run: cd docs/handoff/br-profitability/strategy_search && python3 leakcheck.py ../../../../candles BTCUSDT | tee ../../../../leak_out.txt && python3 leakcheck.py ../../../../candles SOLUSDT | tee -a ../../../../leak_out.txt
      - name: Walk-forward (0.05%, без проковзування)
        shell: bash
        run: cd docs/handoff/br-profitability/strategy_search && MODEL=ml_discover2 python3 walkforward.py ../../../../candles "$SYMS" 0.0005 0.0 | tee ../../../../wf_out.txt
      - name: Walk-forward (0.10%, без проковзування)
        shell: bash
        run: cd docs/handoff/br-profitability/strategy_search && MODEL=ml_discover2 python3 walkforward.py ../../../../candles "$SYMS" 0.0010 0.0 | tee -a ../../../../wf_out.txt
      - name: Walk-forward (0.05% + проковзування 0.03%)
        shell: bash
        run: cd docs/handoff/br-profitability/strategy_search && MODEL=ml_discover2 python3 walkforward.py ../../../../candles "$SYMS" 0.0005 0.0003 | tee -a ../../../../wf_out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: walkforward
          path: wf_out.txt
