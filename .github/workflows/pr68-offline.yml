name: PR68 offline safety tests

on:
  push:
    branches:
      - cursor/office-unified-release-5134
      - claude/eager-pascal-t9e1ac
  pull_request:
    paths:
      - 'office_*.py'
      - 'office2/**'
      - 'scripts/test_pr68_canonical.py'
      - 'scripts/test_telegram_position_gate.py'
      - 'scripts/test_*.py'
      - '.github/workflows/pr68-offline.yml'

permissions:
  contents: read

jobs:
  offline-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OFFICE_DEPO_USDT: '1000'
      OFFICE_EXINFO_SEED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax check
        run: python -m compileall -q office_telegram_policy.py office_telegram_delivery_ledger.py office_relay_wizard.py office_bridge.py office_alert_gate.py scripts/test_pr68_canonical.py scripts/test_telegram_position_gate.py scripts/test_telegram_delivery_ledger.py scripts/test_telegram_ledger_integration.py scripts/test_telegram_scenario_thread.py
      - name: Canonical scenario and delivery dedup (offline)
        run: python scripts/test_pr68_canonical.py
      - name: Position authorization (temporary SQLite, no Telegram)
        run: python scripts/test_telegram_position_gate.py
      - name: Lev cognitive and analyst-first rules (offline)
        run: |
          python scripts/test_lev_cognitive.py
          python scripts/test_lev_analyst_first.py
      - name: MANTA alert gates and desk regression (offline)
        run: |
          python scripts/test_manta_alert_gate.py
          python scripts/test_pr51_desk.py
      - name: Unified release and watching dedup (offline)
        run: |
          python scripts/test_unified_release.py
          python scripts/test_watching_dedup.py
      - name: T6 OHLCV fixture backtest (offline, no look-ahead)
        run: python scripts/test_t6_backtest.py
      - name: Position review and blocked bot actions (offline)
        run: |
          python scripts/test_review_position.py
          python scripts/test_bot_action_blocked.py
      - name: Persistent delivery ledger (temporary SQLite, no Telegram)
        run: python scripts/test_telegram_delivery_ledger.py
      - name: Telegram ledger integration guards (offline)
        run: python scripts/test_telegram_ledger_integration.py
      - name: Real relay behavior with fake Telegram and isolated SQLite
        run: python scripts/test_telegram_relay_behavior.py
      - name: Scenario Telegram reply chain, restart-safe (fake Telegram, SQLite)
        run: python scripts/test_telegram_scenario_thread.py
      - name: Independent risk officer veto (offline, no orders)
        run: python scripts/test_risk_officer.py
      - name: Binance Futures movers discovery (offline, no orders)
        run: python scripts/test_futures_movers.py
      - name: Dynamic universe (offline, off by default)
        run: python scripts/test_dynamic_universe.py
      - name: Learning-контур (облік R/$, класифікація, контрфактуальні фільтри, walk-forward)
        run: python scripts/test_office2_learning.py
      - name: DYNAMIC WATCH_ONLY (режими, ізоляція від LIVE, paper-наслідок)
        run: python scripts/test_dynamic_watch.py
      - name: Paper-супровід READY (вхід після доставки, TP/SL, моделі A/B/C, витрати, рестарт)
        run: python scripts/test_paper.py
      - name: Дослідження ліміту 3 стопи/добу (симуляція, правила, часова лінія)
        run: python scripts/test_gate_study.py
      - name: Живий WATCH/PAPER-радар (preview плану, картки, антиспам, paper-супровід, Telegram-фейк)
        run: python scripts/test_radar_watch.py && python scripts/test_stops.py && python scripts/test_radar_deeplink.py && python scripts/test_trainer.py && python scripts/test_daria_shadow.py && python scripts/test_htf_scenario.py && python scripts/test_source_shadow.py && python scripts/test_sources_registry.py && python scripts/source_shadow_replay.py --selftest && python scripts/test_entry_audit.py && python scripts/test_reaction_shadow.py
      - name: Робота над помилками (ознаки → результат, train/test, захист від підгонки)
        run: python scripts/test_feature_study.py && python scripts/test_history_features.py
      - name: Кеш читань office_signals і окремі пули доставки (затримки Telegram)
        run: python scripts/test_sig_cache.py
      - name: Office2 LIVE BETA (мозок, стани, доставка, lifecycle, без lookahead)
        run: python scripts/test_office2_live.py
      - name: Наскрізний №READY (атомарно, ідемпотентно, рестарт/паралельність) + номер у відповідях
        run: python scripts/test_ready_seq.py
      - name: Продуктивність критичного циклу (кеш карток, бюджет, RSS-ліміт, scout у потоках)
        run: PYTHONPATH=. python scripts/test_perf_guards.py
      - name: Тактики відносно перешкоди (T0–T4, контролі, рекомендація)
        run: PYTHONPATH=. python scripts/test_tactic.py
      - name: Аналітик READY (12 пунктів, картки/зв'язки, критичні дефекти, тижневий розбір)
        run: PYTHONPATH=. python scripts/test_analyst.py
      - name: Одноразовий тест дизайну Telegram (інертний без прапорця, одна спроба, нова картка 1000×1230)
        run: python scripts/test_design_test.py
      - name: PNG-картки READY (LONG/SHORT, 1–3 TP, дешеві монети) — розмір 1000×1230
        run: python scripts/render_card_samples.py /tmp/card_samples
      - name: Summary cache (health-check не чекає на БД)
        run: python scripts/test_summary_cache.py
      - name: Office2 Strong Candle
        run: python scripts/test_office2_strongcandle.py
      - name: Office2 brain v2 (sequence engine + evidence)
        run: python scripts/test_office2_brain2.py
      - name: Office2 latency - pool, adaptive start, parallel delivery, STALE/MISSED (offline)
        run: python scripts/test_office2_latency.py
      - name: Office2 delivery outbox and timing audit (read-only)
        run: python scripts/test_audit_o2_delivery.py
      - name: Office2 exclusive outcome reporting (offline)
        run: python scripts/test_office2_stats_reporting.py
      - name: SMC detectors, models, golden schemes, matrix, shadow integration, replay (offline)
        run: |
          python scripts/test_smc_structure.py
          python scripts/test_smc_liquidity.py
          python scripts/test_smc_imbalance.py
          python scripts/test_smc_blocks.py
          python scripts/test_smc_sessions_pd_flow.py
          python scripts/test_smc_models.py
          python scripts/test_smc_golden.py
          python scripts/test_smc_matrix.py
          python scripts/test_smc_integration.py
          python scripts/test_smc_replay.py
          python scripts/test_smc_invariants.py
          python scripts/test_integration_contract.py
      - name: Evidence-backed market thesis contract (offline, no orders)
        run: python scripts/test_market_thesis.py
      - name: Market feed freshness and provenance veto (offline)
        run: python scripts/test_feed_quality.py
      - name: Lev independent risk veto integration (offline)
        run: python scripts/test_lev_risk_integration.py
      - name: Risk Officer in live Lev cycle, shadow/enforce (temporary SQLite)
        run: python scripts/test_risk_context_cycle.py
      - name: Lev thesis journal, append-only versions (temporary SQLite)
        run: python scripts/test_thesis_journal.py
      - name: Market regime v1 classifier (offline)
        run: python scripts/test_market_regime.py
      - name: Session Desk ranges, sweep vs acceptance, DST (offline)
        run: python scripts/test_session_desk.py
      - name: Execution Planner v1 pre-entry checks (offline)
        run: python scripts/test_execution_check.py
      - name: Legacy proactive path needs Lev SEND for ACTIVE (offline)
        run: python scripts/test_legacy_guard.py
      - name: Lev replay harness self-test (synthetic candles, pipeline only)
        run: python scripts/test_replay_lev_history.py
      - name: Full regression — every scripts/test_*.py (no network required)
        run: |
          fail=0
          for t in scripts/test_*.py; do
            if timeout 180 python "$t" </dev/null > /tmp/out.txt 2>&1; then
              echo "ok  $t"
            else
              echo "FAIL $t"; tail -20 /tmp/out.txt; fail=1
            fi
          done
          exit $fail
      - name: London and NY DST desk clock (offline)
        run: python scripts/test_session_dst.py
      - name: Exchange tick display and no float tails (offline)
        run: python scripts/test_price_format_ui.py
      - name: Lev scenario card and Telegram card format (offline)
        run: |
          python scripts/test_lev_trader_card.py
          python scripts/test_t8_telegram_filter.py
      - name: Mini App five tabs, scenario card and honest Risk tab (offline)
        run: |
          python scripts/test_mini_v2.py
          python scripts/test_mini_v2_cards.py
      - name: Final launch tests (offline)
        run: |
          python scripts/test_ws_klines.py
          python scripts/test_memory_budget.py
          python scripts/test_learning_chunked_load.py
          python scripts/test_radar_sync_chunks.py
          python scripts/test_channel_tag.py
          python scripts/test_calendar.py
          python scripts/test_levels_payload.py
          python scripts/test_replay.py
          python scripts/test_rr_analysis.py
          python scripts/test_rr_rule.py
          python scripts/test_confirm_tags.py
          python scripts/test_scout_shortlist.py
          python scripts/test_market_context.py
          python scripts/test_smc_wyckoff.py
          python scripts/test_liq_map.py
          python scripts/test_data_stability.py
          python scripts/test_launch_once.py
          python scripts/test_data_provenance.py
          python scripts/test_daria_steps.py
          python scripts/test_topdown.py
          python scripts/test_topdown_brain.py
          python scripts/test_replay_ltf_nofuture.py
          python scripts/test_events_perf.py
          python scripts/test_counterfactual_be.py
          python scripts/test_learning_flags_shadow.py
          python scripts/test_stage_gate.py
          python scripts/test_feed_htf_freshness.py

  mini-app-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OFFICE_EXINFO_SEED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies and Playwright Chromium
        run: |
          python -m pip install -r requirements.txt playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Mini App browser smoke (phone/desktop, XSS, error/loading states)
        run: python scripts/ui_smoke_mini_v2.py
      - name: READY-картка (ієрархія, «зараз», прогрес, телефон/десктоп)
        run: python scripts/ui_ready_card.py
      - name: Office2 Mini App card (цілісна теза, карта зверху вниз)
        run: python scripts/ui_office2_card.py
      - name: Інтерактивний графік (локальна бібліотека, історія, масштаб, ТФ, шар ліквідності)
        run: python scripts/ui_chart_interactive.py
      - name: Методологія 82 + рушій гіпотез (SHADOW, вимкнено за замовчуванням)
        run: |
          for t in scripts/test_method_*.py scripts/test_hypothesis.py; do PYTHONPATH=. python "$t"; done

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: office
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OFFICE_EXINFO_SEED: '1'
      OFFICE_TEST_PG_URL: postgresql://postgres:ci@127.0.0.1:5432/office
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: PR68/69 schema, ledger, journals and Mini App queries on PostgreSQL 16
        run: python scripts/test_pg_integration.py
