name: ml-discover
on:
  push:
    branches: [claude/eager-pascal-t9e1ac]
    paths:
      - .github/workflows/ml-discover.yml
      - docs/handoff/br-profitability/strategy_search/ml_discover.py
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas scikit-learn
      - name: Fetch M15 2022-01..2026-10
        run: |
          SYMS=BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,BNBUSDT,LTCUSDT,DOTUSDT,ATOMUSDT
          echo "SYMS=$SYMS" >> $GITHUB_ENV
          python3 scripts/fetch_binance_klines.py candles $SYMS 15m:2022-01-01:2026-11-01 | tail -2
      - name: ML (0.05%)
        run: python3 docs/handoff/br-profitability/strategy_search/ml_discover.py candles "$SYMS" 0.0005 | tee ml_out.txt
      - name: ML (0.10%)
        run: python3 docs/handoff/br-profitability/strategy_search/ml_discover.py candles "$SYMS" 0.0010 | tee -a ml_out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ml-discover
          path: ml_out.txt
