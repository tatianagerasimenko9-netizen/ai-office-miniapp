name: tdpairs
on:
  push:
    branches: [claude/eager-pascal-t9e1ac]
    paths:
      - .github/workflows/tdpairs.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/eager-pascal-t9e1ac
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas scikit-learn numba
      - name: Fetch
        shell: bash
        run: |
          TRAIN=BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,BNBUSDT,LTCUSDT,DOTUSDT,ATOMUSDT
          echo "TRAIN=$TRAIN" >> $GITHUB_ENV
          for S in ${TRAIN//,/ }; do python3 scripts/fetch_binance_klines.py candles $S 15m:2022-01-01:2026-11-22 | tr '\n' ' '; echo; done
          test -s candles/BTCUSDT/15m.csv || { echo 'FETCH FAILED'; exit 1; }
      - name: TD pairs
        shell: bash
        run: |
          D=$PWD/docs/handoff/br-profitability
          cd $D/strategy_search
          python3 td_pairs.py ../../../../candles "$TRAIN" 0.0010 $D/data/td_pairs_trades.csv | tee $D/tdpairs_out.txt
      - name: Зберегти
        shell: bash
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add docs/handoff/br-profitability/tdpairs_out.txt docs/handoff/br-profitability/data/td_pairs_trades.csv
          git commit -m "tdpairs: протилежні сигнали ІНТРАДЕЙ (автоматично)"
          for i in 1 2 3; do git pull --rebase -X theirs origin claude/eager-pascal-t9e1ac && git push origin HEAD:claude/eager-pascal-t9e1ac && break; sleep 5; done
