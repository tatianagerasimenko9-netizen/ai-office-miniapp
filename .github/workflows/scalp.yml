name: scalp
on:
  push:
    branches: [claude/eager-pascal-t9e1ac]
    paths:
      - .github/workflows/scalp.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 175
    strategy:
      fail-fast: false
      matrix:
        g: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/eager-pascal-t9e1ac
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas
      - name: Fetch M15
        shell: bash
        run: |
          ALLC=BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,BNBUSDT,LTCUSDT,DOTUSDT,ATOMUSDT,TRXUSDT,NEARUSDT,OPUSDT,FILUSDT,ETCUSDT,UNIUSDT,AAVEUSDT,MKRUSDT,SANDUSDT,MANAUSDT,AXSUSDT,GALAUSDT,RUNEUSDT,LDOUSDT,CRVUSDT,SNXUSDT,ICPUSDT,XLMUSDT,BCHUSDT,ALGOUSDT,VETUSDT,GRTUSDT,APEUSDT,IMXUSDT,INJUSDT,APTUSDT,EOSUSDT,HBARUSDT,THETAUSDT,DYDXUSDT
          G=${{ matrix.g }}
          MINE=$(echo $ALLC | tr ',' '\n' | awk -v g=$G 'NR%6==g%6' | paste -sd, -)
          echo "ALL=$MINE" >> $GITHUB_ENV
          echo "coins: $MINE"
          for S in ${MINE//,/ }; do python3 scripts/fetch_binance_klines.py candles $S 15m:2022-01-01:2026-11-21 | tr '\n' ' '; echo; done
          test -s candles/BTCUSDT/15m.csv -o -s candles/ETHUSDT/15m.csv -o -s candles/SOLUSDT/15m.csv || ls candles
      - name: Фігури і канал на M15 та H1
        shell: bash
        run: |
          D=docs/handoff/br-profitability
          export TFS=M15,H1
          python3 $D/strategy_search/patterns_lab.py candles "$ALL" 0.001 $D/scalp_pat_g${{ matrix.g }} > $D/scalp_pat_g${{ matrix.g }}_out.txt
          python3 $D/strategy_search/channel_test.py candles "$ALL" 0.001 $D/scalp_chan_g${{ matrix.g }} > $D/scalp_chan_g${{ matrix.g }}_out.txt
          tail -3 $D/scalp_pat_g${{ matrix.g }}_out.txt
      - name: Зберегти
        shell: bash
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add docs/handoff/br-profitability/scalp_*
          git commit -m "scalp: група ${{ matrix.g }} (автоматично)"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin claude/eager-pascal-t9e1ac && git push origin HEAD:claude/eager-pascal-t9e1ac && break; sleep $((RANDOM%20+5)); done
