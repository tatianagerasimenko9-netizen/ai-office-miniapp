name: newcoins
on:
  push:
    branches: [claude/eager-pascal-t9e1ac]
    paths:
      - .github/workflows/newcoins.yml
      - docs/handoff/br-profitability/strategy_search/newcoins.py
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/eager-pascal-t9e1ac
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas scikit-learn
      - name: Fetch M15 2022-01..2026-10 (12 навчальних + 30 нових монет, по одній)
        shell: bash
        run: |
          TRAIN=BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,BNBUSDT,LTCUSDT,DOTUSDT,ATOMUSDT
          NEW=TRXUSDT,NEARUSDT,OPUSDT,FILUSDT,ETCUSDT,UNIUSDT,AAVEUSDT,MKRUSDT,SANDUSDT,MANAUSDT,AXSUSDT,GALAUSDT,RUNEUSDT,LDOUSDT,CRVUSDT,SNXUSDT,ICPUSDT,XLMUSDT,BCHUSDT,ALGOUSDT,VETUSDT,GRTUSDT,APEUSDT,IMXUSDT,INJUSDT,APTUSDT,EOSUSDT,HBARUSDT,THETAUSDT,DYDXUSDT
          echo "TRAIN=$TRAIN" >> $GITHUB_ENV; echo "NEW=$NEW" >> $GITHUB_ENV
          for S in ${TRAIN//,/ } ${NEW//,/ }; do
            python3 scripts/fetch_binance_klines.py candles $S 15m:2022-01-01:2026-11-01 | tr '\n' ' '; echo
          done
          test -s candles/BTCUSDT/15m.csv || { echo 'FETCH FAILED'; exit 1; }
      - name: Нові монети (0.10%)
        shell: bash
        run: cd docs/handoff/br-profitability/strategy_search && python3 newcoins.py ../../../../candles "$TRAIN" "$NEW" 0.0010 | tee ../../../../nc_out.txt
      - name: Нові монети (0.05%)
        shell: bash
        run: cd docs/handoff/br-profitability/strategy_search && python3 newcoins.py ../../../../candles "$TRAIN" "$NEW" 0.0005 | tee -a ../../../../nc_out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: newcoins
          path: nc_out.txt
