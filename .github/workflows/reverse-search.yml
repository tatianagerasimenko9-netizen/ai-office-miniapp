name: reverse-search
on:
  push:
    branches: [claude/eager-pascal-t9e1ac]
    paths:
      - .github/workflows/reverse-search.yml
      - docs/handoff/br-profitability/strategy_search/reverse_search.py
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas scikit-learn
      - name: Fetch 12m M15
        run: |
          SYMS=BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,BNBUSDT,LTCUSDT,DOTUSDT,ATOMUSDT
          echo "SYMS=$SYMS" >> $GITHUB_ENV
          python3 scripts/fetch_binance_klines.py candles $SYMS 15m:2025-11-01:2026-11-01 | tail -3
      - name: Search (комісія 0.10%)
        run: python3 docs/handoff/br-profitability/strategy_search/reverse_search.py candles "$SYMS" 0.0010 | tee reverse_out.txt
      - name: Search (комісія 0.05%)
        run: python3 docs/handoff/br-profitability/strategy_search/reverse_search.py candles "$SYMS" 0.0005 | tee -a reverse_out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: reverse-search
          path: reverse_out.txt
