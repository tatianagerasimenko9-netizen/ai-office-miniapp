name: History study (old Lev plans, isolated, read-only)

# Ручний запуск. Результати старих планів за свічками Binance-архіву + ознаки з даних ДО рішення + train/test. Нічого не пише в БД/Render/Telegram.
on:
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Символи через кому (порожньо = усі з фікстур)'
        default: ''

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy tzdata
      - name: History study
        run: python -u scripts/history_study.py history_study.json "${{ inputs.symbols }}" | tee "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: history-study
          path: history_study.json
