name: brhist
on:
  push:
    branches: [claude/eager-pascal-t9e1ac]
    paths:
      - .github/workflows/brhist.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/eager-pascal-t9e1ac
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas
      - name: Fetch
        shell: bash
        run: |
          TRAIN=BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ADAUSDT,AVAXUSDT,LINKUSDT,BNBUSDT,LTCUSDT,DOTUSDT,ATOMUSDT
          echo "TRAIN=$TRAIN" >> $GITHUB_ENV
          for S in ${TRAIN//,/ }; do python3 scripts/fetch_binance_klines.py candles $S 15m:2022-01-01:2026-11-22 | tr '\n' ' '; echo; done
          test -s candles/BTCUSDT/15m.csv || { echo 'FETCH FAILED'; exit 1; }
      - name: Replay
        shell: bash
        run: |
          D=$PWD/docs/handoff/br-profitability
          TF=3600 HOR=96 python3 $D/strategy_search/br_hist.py candles "$TRAIN" $D/data/br_hist_h1.csv | tee $D/brhist_h1_out.txt
          TF=14400 HOR=60 python3 $D/strategy_search/br_hist.py candles "$TRAIN" $D/data/br_hist_h4.csv | tee $D/brhist_h4_out.txt
      - name: Save
        shell: bash
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          gzip -f docs/handoff/br-profitability/data/br_hist_h1.csv docs/handoff/br-profitability/data/br_hist_h4.csv
          git add docs/handoff/br-profitability/brhist_h1_out.txt docs/handoff/br-profitability/brhist_h4_out.txt docs/handoff/br-profitability/data/br_hist_h1.csv.gz docs/handoff/br-profitability/data/br_hist_h4.csv.gz
          git commit -m "brhist: B&R на H1 і H4 (автоматично)"
          for i in 1 2 3; do git pull --rebase -X theirs origin claude/eager-pascal-t9e1ac && git push origin HEAD:claude/eager-pascal-t9e1ac && break; sleep 5; done
