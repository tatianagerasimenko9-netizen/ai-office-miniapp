name: TMP design test send (one-off, delete after use)

# Одноразово: одне тестове повідомлення з новою PNG-карткою (#242) і кнопкою «📊 Сценарій».
# Не створює READY/угоду/lifecycle, не чіпає БД і Worker. Токен лише з secrets, у лог не потрапляє.
on:
  push:
    branches: ['tmp/design-test-bbce25e']
    paths: ['.github/workflows/tmp-design-test-send.yml', 'scripts/design_test_send.py']

permissions:
  contents: read

concurrency:
  group: tmp-design-test-send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy matplotlib pillow tzdata
      - name: Secrets present? (names only, values never printed)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          OFFICE_CHAT_ID: ${{ secrets.OFFICE_CHAT_ID }}
        run: |
          for n in TG_BOT_TOKEN OFFICE_CHAT_ID; do
            if [ -n "${!n}" ]; then echo "$n: present"; else echo "$n: MISSING"; fi
          done
      - name: Render new card and send exactly one message
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          OFFICE_CHAT_ID: ${{ secrets.OFFICE_CHAT_ID }}
          OFFICE_MINI_APP_URL: ${{ secrets.OFFICE_MINI_APP_URL }}
        run: python -u scripts/design_test_send.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-test-card
          path: design_test_card.png
          if-no-files-found: ignore
