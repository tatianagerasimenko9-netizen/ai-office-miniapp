name: Binance Futures REST shared IP safety
on:
  pull_request:
    paths:
      - 'office_market_data.py'
      - 'scripts/test_fapi_weight_headroom.py'
      - 'scripts/test_binance_backoff_probe.py'
      - '.github/workflows/binance-ip-safety.yml'
  workflow_dispatch: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python scripts/test_fapi_weight_headroom.py
      - run: python scripts/test_binance_backoff_probe.py
