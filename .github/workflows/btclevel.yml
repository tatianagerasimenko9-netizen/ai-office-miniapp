name: btclevel
on:
  push:
    branches: [claude/eager-pascal-t9e1ac]
    paths:
      - .github/workflows/btclevel.yml
      - docs/handoff/br-profitability/strategy_search/btclevel.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/eager-pascal-t9e1ac
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas scikit-learn
      - name: Fetch BTC
        shell: bash
        run: |
          for S in BTCUSDT; do
            python3 scripts/fetch_binance_klines.py candles $S 15m:2022-01-01:2026-11-01 | tr '\n' ' '; echo
          done
          test -s candles/BTCUSDT/15m.csv || { echo 'FETCH FAILED'; exit 1; }
      - name: Рівні доби BTC
        shell: bash
        run: |
          cd docs/handoff/br-profitability/strategy_search
          python3 btclevel.py ../../../../candles 0.001 | tee ../btclevel_out.txt
          python3 btclevel.py ../../../../candles 0.002 | tee -a ../btclevel_out.txt
      - name: Зберегти результат у гілку
        shell: bash
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add docs/handoff/br-profitability/btclevel_out.txt
          git commit -m "btclevel: результат угод TD-V1 (автоматично)" && git pull --rebase origin claude/eager-pascal-t9e1ac && git push origin HEAD:claude/eager-pascal-t9e1ac
